<svg xmlns="http://www.w3.org/2000/svg" viewBox="-180 0 940 380" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Measuring respiration in yeast</title>
<desc id="d">Yeast in glucose solution in a test tube stands in a water bath at a set temperature. A delivery tube carries carbon dioxide bubbles into water, where they are counted.</desc>
<rect x="-180" width="940" height="380" fill="#ffffff"/>
<rect x="60" y="120" width="220" height="200" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/><path d="M140 60 v220 a30 30 0 0 0 60 0 v-220" fill="#fffbeb" stroke="#334155" stroke-width="3"/><path d="M142 160 v120 a28 28 0 0 0 56 0 v-120 z" fill="#fde68a"/><circle cx="160" cy="200" r="4" fill="#a16207"/><circle cx="178" cy="230" r="4" fill="#a16207"/><circle cx="165" cy="262" r="4" fill="#a16207"/><circle cx="185" cy="280" r="4" fill="#a16207"/><circle cx="158" cy="240" r="4" fill="#a16207"/><rect x="134" y="50" width="72" height="18" rx="4" fill="#475569"/><path d="M170 50 V30 H420 V170" fill="none" stroke="#334155" stroke-width="5"/><path d="M370 120 v130 h100 v-130" fill="#e0f2fe" stroke="#334155" stroke-width="3"/><rect x="372" y="150" width="96" height="98" fill="#bfdbfe"/><circle cx="420" cy="200" r="6" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/><circle cx="420" cy="180" r="6" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/><circle cx="420" cy="160" r="6" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/><line x1="-10" y1="130" x2="62" y2="140" stroke="#222" stroke-width="1.4"/><text x="-18" y="136" text-anchor="end" font-size="20" fill="#1a1a1a">water bath</text><text x="-18" y="156" text-anchor="end" font-size="16" fill="#555">set temperature</text><line x1="-10" y1="240" x2="148" y2="230" stroke="#222" stroke-width="1.4"/><text x="-18" y="246" text-anchor="end" font-size="20" fill="#1a1a1a">yeast in</text><text x="-18" y="266" text-anchor="end" font-size="16" fill="#555">glucose solution</text><line x1="560" y1="180" x2="428" y2="180" stroke="#222" stroke-width="1.4"/><text x="568" y="186" text-anchor="start" font-size="20" fill="#1a1a1a">carbon dioxide</text><text x="568" y="206" text-anchor="start" font-size="16" fill="#555">bubbles: count them</text><line x1="560" y1="60" x2="420" y2="40" stroke="#222" stroke-width="1.4"/><text x="568" y="66" text-anchor="start" font-size="20" fill="#1a1a1a">delivery tube</text><text x="270" y="360" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">More bubbles per minute means faster respiration.</text>
</svg>
