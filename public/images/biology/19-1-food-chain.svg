<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">A food chain and energy loss</title>
<desc id="d">Energy from the Sun is captured by grass (producer), passed to a rabbit (primary consumer), then to a fox (secondary consumer). About 90% is lost at each step, mostly as heat.</desc>
<rect x="0" width="640" height="360" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs><circle cx="60" cy="90" r="30" fill="#fde68a" stroke="#ca8a04" stroke-width="3"/><text x="60" y="145" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Sun</text><rect x="115.0" y="58.0" width="150" height="64" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/><text x="190" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Grass</text><text x="190" y="107" text-anchor="middle" font-size="14" font-weight="400" fill="#1a1a1a">producer</text><rect x="280.0" y="58.0" width="150" height="64" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/><text x="355" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Rabbit</text><text x="355" y="107" text-anchor="middle" font-size="14" font-weight="400" fill="#1a1a1a">primary consumer</text><rect x="450.0" y="58.0" width="150" height="64" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/><text x="525" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Fox</text><text x="525" y="107" text-anchor="middle" font-size="14" font-weight="400" fill="#1a1a1a">secondary consumer</text><defs><marker id="ahf59e0b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker></defs><line x1="95" y1="90" x2="125" y2="90" stroke="#f59e0b" stroke-width="4" marker-end="url(#ahf59e0b)"/><defs><marker id="ah15803d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker></defs><line x1="272" y1="90" x2="288" y2="90" stroke="#15803d" stroke-width="4" marker-end="url(#ah15803d)"/><defs><marker id="ah15803d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker></defs><line x1="432" y1="90" x2="448" y2="90" stroke="#15803d" stroke-width="4" marker-end="url(#ah15803d)"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#15803d">Arrows show the direction of energy flow</text><path d="M200 124 C190 160 210 180 200 210" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 5"/><text x="200" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">heat lost</text><path d="M360 124 C350 160 370 180 360 210" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 5"/><text x="360" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">heat lost</text><path d="M520 124 C510 160 530 180 520 210" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 5"/><text x="520" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">heat lost</text><text x="320" y="275" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">About 90% of the energy is lost at each step:</text><text x="320" y="298" text-anchor="middle" font-size="16" font-weight="400" fill="#1a1a1a">respiration (heat), parts not eaten, faeces, excretion.</text><text x="200" y="340" text-anchor="middle" font-size="18" font-weight="800" fill="#15803d">100%</text><text x="360" y="340" text-anchor="middle" font-size="18" font-weight="800" fill="#15803d">about 10%</text><text x="520" y="340" text-anchor="middle" font-size="18" font-weight="800" fill="#15803d">about 1%</text>
</svg>
