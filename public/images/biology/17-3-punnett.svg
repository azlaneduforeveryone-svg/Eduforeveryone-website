<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 325" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Punnett squares</title>
<desc id="d">Crossing two heterozygous tall plants (Tt and Tt) gives 3 tall to 1 short. Crossing Tt with tt gives 1 tall to 1 short.</desc>
<rect x="0" width="640" height="325" fill="#ffffff"/>
<text x="120" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#1a1a1a">Tt x Tt</text><text x="90" y="72" text-anchor="middle" font-size="20" font-weight="800" fill="#b91c1c">T</text><text x="170" y="72" text-anchor="middle" font-size="20" font-weight="800" fill="#b91c1c">t</text><text x="30" y="124" text-anchor="middle" font-size="20" font-weight="800" fill="#1d4ed8">T</text><text x="30" y="204" text-anchor="middle" font-size="20" font-weight="800" fill="#1d4ed8">t</text><rect x="50" y="85" width="80" height="80" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="90" y="125" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">TT</text><text x="90" y="148" text-anchor="middle" font-size="13" font-weight="400" fill="#555">tall</text><rect x="130" y="85" width="80" height="80" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="170" y="125" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Tt</text><text x="170" y="148" text-anchor="middle" font-size="13" font-weight="400" fill="#555">tall</text><rect x="50" y="165" width="80" height="80" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="90" y="205" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Tt</text><text x="90" y="228" text-anchor="middle" font-size="13" font-weight="400" fill="#555">tall</text><rect x="130" y="165" width="80" height="80" fill="#fef3c7" stroke="#334155" stroke-width="2"/><text x="170" y="205" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">tt</text><text x="170" y="228" text-anchor="middle" font-size="13" font-weight="400" fill="#555">short</text><text x="120" y="275" text-anchor="middle" font-size="18" font-weight="800" fill="#0f766e">3 tall : 1 short</text><text x="440" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#1a1a1a">Tt x tt</text><text x="410" y="72" text-anchor="middle" font-size="20" font-weight="800" fill="#b91c1c">T</text><text x="490" y="72" text-anchor="middle" font-size="20" font-weight="800" fill="#b91c1c">t</text><text x="350" y="124" text-anchor="middle" font-size="20" font-weight="800" fill="#1d4ed8">t</text><text x="350" y="204" text-anchor="middle" font-size="20" font-weight="800" fill="#1d4ed8">t</text><rect x="370" y="85" width="80" height="80" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="410" y="125" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Tt</text><text x="410" y="148" text-anchor="middle" font-size="13" font-weight="400" fill="#555">tall</text><rect x="450" y="85" width="80" height="80" fill="#fef3c7" stroke="#334155" stroke-width="2"/><text x="490" y="125" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">tt</text><text x="490" y="148" text-anchor="middle" font-size="13" font-weight="400" fill="#555">short</text><rect x="370" y="165" width="80" height="80" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="410" y="205" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Tt</text><text x="410" y="228" text-anchor="middle" font-size="13" font-weight="400" fill="#555">tall</text><rect x="450" y="165" width="80" height="80" fill="#fef3c7" stroke="#334155" stroke-width="2"/><text x="490" y="205" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">tt</text><text x="490" y="228" text-anchor="middle" font-size="13" font-weight="400" fill="#555">short</text><text x="440" y="275" text-anchor="middle" font-size="18" font-weight="800" fill="#0f766e">1 tall : 1 short</text><text x="320" y="310" text-anchor="middle" font-size="16" font-weight="400" fill="#374151">T = tall (dominant)  t = short (recessive)</text>
</svg>
