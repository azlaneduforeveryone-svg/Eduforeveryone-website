<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 235" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Anaerobic respiration equations</title>
<desc id="d">In humans glucose gives lactic acid. In yeast glucose gives ethanol plus carbon dioxide.</desc>
<rect x="0" width="640" height="235" fill="#ffffff"/>
<text x="320" y="35" text-anchor="middle" font-size="19" font-weight="700" fill="#555">In human muscles</text><text x="150" y="85" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">glucose</text><text x="490" y="85" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">lactic acid</text><defs><marker id="ah0f766e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker></defs><line x1="280" y1="78" x2="360" y2="78" stroke="#0f766e" stroke-width="4" marker-end="url(#ah0f766e)"/><text x="320" y="63" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">no oxygen</text><text x="320" y="155" text-anchor="middle" font-size="19" font-weight="700" fill="#555">In yeast</text><text x="150" y="205" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">glucose</text><text x="505" y="205" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">ethanol + carbon dioxide</text><defs><marker id="ah0f766e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker></defs><line x1="280" y1="198" x2="360" y2="198" stroke="#0f766e" stroke-width="4" marker-end="url(#ah0f766e)"/><text x="320" y="183" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">no oxygen</text>
</svg>
