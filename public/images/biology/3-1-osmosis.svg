<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 590" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Osmosis across a partially permeable membrane</title>
<desc id="d">Water molecules move from the dilute solution (higher water potential) to the concentrated solution (lower water potential) through a partially permeable membrane. Sugar molecules are too big to pass.</desc>
<rect x="0" width="640" height="590" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs><rect x="40" y="60" width="560" height="260" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="2.5"/><line x1="320" y1="60" x2="320" y2="320" stroke="#b45309" stroke-width="5" stroke-dasharray="14 9"/><circle cx="227" cy="202" r="14" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/><circle cx="135" cy="194" r="14" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/><circle cx="478" cy="253" r="14" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/><circle cx="374" cy="203" r="14" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/><circle cx="407" cy="141" r="14" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/><circle cx="528" cy="192" r="14" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/><circle cx="479" cy="247" r="14" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/><circle cx="560" cy="178" r="14" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/><circle cx="491" cy="191" r="14" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/><circle cx="468" cy="232" r="14" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/><circle cx="168" cy="198" r="5" fill="#3b82f6"/><circle cx="175" cy="292" r="5" fill="#3b82f6"/><circle cx="230" cy="277" r="5" fill="#3b82f6"/><circle cx="291" cy="135" r="5" fill="#3b82f6"/><circle cx="195" cy="292" r="5" fill="#3b82f6"/><circle cx="265" cy="107" r="5" fill="#3b82f6"/><circle cx="85" cy="177" r="5" fill="#3b82f6"/><circle cx="73" cy="130" r="5" fill="#3b82f6"/><circle cx="73" cy="229" r="5" fill="#3b82f6"/><circle cx="251" cy="281" r="5" fill="#3b82f6"/><circle cx="94" cy="240" r="5" fill="#3b82f6"/><circle cx="220" cy="108" r="5" fill="#3b82f6"/><circle cx="276" cy="298" r="5" fill="#3b82f6"/><circle cx="110" cy="294" r="5" fill="#3b82f6"/><circle cx="155" cy="187" r="5" fill="#3b82f6"/><circle cx="302" cy="266" r="5" fill="#3b82f6"/