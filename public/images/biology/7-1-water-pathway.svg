<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 530" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">The path of water through a plant</title>
<desc id="d">Water enters a root hair cell from the soil, crosses the root cortex cells, enters the xylem, travels up to the leaf and enters the mesophyll cells.</desc>
<rect x="0" width="700" height="530" fill="#ffffff"/>
<text x="320" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Water moves from the soil, across the root, into the xylem</text><rect x="20" y="50" width="130" height="200" fill="#e7d7bd"/><circle cx="45" cy="80" r="14" fill="#c8ad86" stroke="#8b6b45" stroke-width="1.5"/><circle cx="100" cy="95" r="18" fill="#c8ad86" stroke="#8b6b45" stroke-width="1.5"/><circle cx="60" cy="150" r="16" fill="#c8ad86" stroke="#8b6b45" stroke-width="1.5"/><circle cx="120" cy="170" r="12" fill="#c8ad86" stroke="#8b6b45" stroke-width="1.5"/><circle cx="50" cy="215" r="15" fill="#c8ad86" stroke="#8b6b45" stroke-width="1.5"/><circle cx="110" cy="225" r="17" fill="#c8ad86" stroke="#8b6b45" stroke-width="1.5"/><path d="M150 110 h60 v80 h-60 v-18 h-90 a10 10 0 0 1 0 -20 h90 z" fill="#f4f9e8" stroke="#4d6b1f" stroke-width="2.5"/><rect x="214" y="110" width="58" height="38" rx="6" fill="#fefce8" stroke="#a16207" stroke-width="2"/><rect x="214" y="152" width="58" height="38" rx="6" fill="#fefce8" stroke="#a16207" stroke-width="2"/><rect x="276" y="110" width="58" height="38" rx="6" fill="#fefce8" stroke="#a16207" stroke-width="2"/><rect x="276" y="152" width="58" height="38" rx="6" fill="#fefce8" stroke="#a16207" stroke-width="2"/><rect x="338" y="110" width="58" height="38" rx="6" fill="#fefce8" stroke="#a16207" stroke-width="2"/><rect x="338" y="152" width="58" height="38" rx="6" fill="#fefce8" stroke="#a16207" stroke-width="2"/><rect x="404" y="70" width="46" height="180" fill="#ffffff" stroke="#334155" stroke-width="3"/><rect x="412" y="70" width="30" height="180" fill="#bfdbfe"/><defs><marker id="ah1d4ed8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/></marker></defs><line x1="70" y1="160" x2="190" y2="160" stroke="#1d4ed8" stroke-width="4" marker-end="url(#ah1d4ed8)"/><defs><marker id="ah1d4ed8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/></marker></defs><line x1="220" y1="131" x2="395" y2="131" stroke="#1d4ed8" stroke-width="4" marker-end="url(#ah1d4ed8)"/><defs><marker id="ah1d4ed8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/></marker></defs><line x1="427" y1="240" x2="427" y2="80" stroke="#1d4ed8" stroke-width="4" marker-end="url(#ah1d4ed8)"/><line x1="85" y1="300" x2="80" y2="172" stroke="#222" stroke-width="1.4"/><text x="93" y="306" text-anchor="middle" font-size="20" fill="#1a1a1a">root hair cell</text><line x1="300" y1="300" x2="300" y2="195" stroke="#222" stroke-width="1.4"/><text x="308" y="306" text-anchor="middle" font-size="20" fill="#1a1a1a">root cortex cells</text><line x1="520" y1="160" x2="452" y2="160" stroke="#222" stroke-width="1.4"/><text x="528" y="166" text-anchor="start" font-size="20" fill="#1a1a1a">xylem</text><text x="528" y="186" text-anchor="start" font-size="16" fill="#555">(up to the leaves)</text><text x="85" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#6b4f2a">soil</text><rect x="120" y="345" width="400" height="36" rx="8" fill="#e0f2fe" stroke="#1d4ed8" stroke-width="1.5"/><text x="320" y="369" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">1. Root hair cell</text><rect x="120" y="389" width="400" height="36" rx="8" fill="#e0f2fe" stroke="#1d4ed8" stroke-width="1.5"/><text x="320" y="413" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">2. Root cortex cells</text><rect x="120" y="433" width="400" height="36" rx="8" fill="#e0f2fe" stroke="#1d4ed8" stroke-width="1.5"/><text x="320" y="457" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">3. Xylem (root, stem, leaf)</text><rect x="120" y="477" width="400" height="36" rx="8" fill="#e0f2fe" stroke="#1d4ed8" stroke-width="1.5"/><text x="320" y="501" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">4. Mesophyll cells in the leaf</text>
</svg>
