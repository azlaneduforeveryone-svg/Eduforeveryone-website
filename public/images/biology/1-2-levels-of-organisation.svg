<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Levels of organisation</title>
<desc id="d">Five levels from smallest to largest: a muscle cell, muscle tissue, the heart as an organ, the circulatory system, and a whole human organism.</desc>
<rect x="0" width="640" height="760" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs><path d="M40 75 C70 55 130 55 160 75 C130 95 70 95 40 75 Z" fill="#fde2e2" stroke="#b91c1c" stroke-width="2.5"/><ellipse cx="100" cy="75" rx="9" ry="6" fill="#c4b5fd" stroke="#5b3a8c" stroke-width="1.5"/><text x="230" y="70" text-anchor="start" font-size="24" font-weight="800" fill="#1a1a1a">1. Cell</text><text x="230" y="102" text-anchor="start" font-size="20" font-weight="400" fill="#1a1a1a">One muscle cell</text><defs><marker id="ahc0392b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs><line x1="95" y1="148" x2="95" y2="172" stroke="#c0392b" stroke-width="3" marker-end="url(#ahc0392b)"/><path d="M20 195 C32 186 56 186 68 195 C56 204 32 204 20 195 Z" fill="#fde2e2" stroke="#b91c1c" stroke-width="1.6"/><path d="M68 195 C80 186 104 186 116 195 C104 204 80 204 68 195 Z" fill="#fde2e2" stroke="#b91c1c" stroke-width="1.6"/><path d="M116 195 C128 186 152 186 164 195 C152 204 128 204 116 195 Z" fill="#fde2e2" stroke="#b91c1c" stroke-width="1.6"/><path d="M40 219 C52 210 76 210 88 219 C76 228 52 228 40 219 Z" fill="#fde2e2" stroke="#b91c1c" stroke-width="1.6"/><path d="M88 219 C100 210 124 210 136 219 C124 228 100 228 88 219 Z" fill="#fde2e2" stroke="#b91c1c" stroke-width="1.6"/><path d="M136 219 C148 210 172 210 184 219 C172 228 148 228 136 219 Z" fill="#fde2e2" stroke="#b91c1c" stroke-width="1.6"/><path d="M20 243 C32 234 56 234 68 243 C56 252 32 252 20 243 Z" fill="#fde2e2" stroke="#b91c1c" stroke-width="1.6"/><path d="M68 243 C80 234 104 234 116 243 C104 252 80 252 68 243 Z" fill="#fde2e2" stroke="#b91c1c" stroke-width="1.6"/><path d="M116 243 C128 234 152 234 164 243 C152 252 128 252 116 243 Z" fill="#fde2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="230" y="215" text-anchor="start" font-size="24" font-weight="800" fill="#1a1a1a">2. Tissue</text><text x="230" y="247" text-anchor="start" font-size="20" font-weight="400" fill="#1a1a1a">Many muscle cells together</text><defs><marker id="ahc0392b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs><line x1="95" y1="293" x2="95" y2="317" stroke="#c0392b" stroke-width="3" marker-end="url(#ahc0392b)"/><path transform="translate(50 325) scale(1.05)" d="M50 88 C20 65 0 45 4 25 C8 6 32 0 50 20 C68 0 92 6 96 25 C100 45 80 65 50 88 Z" fill="#f87171" stroke="#991b1b" stroke-width="3"/><text x="230" y="360" text-anchor="start" font-size="24" font-weight="800" fill="#1a1a1a">3. Organ</text><text x="230" y="392" text-anchor="start" font-size="20" font-weight="400" fill="#1a1a1a">The heart</text><text x="230" y="418" text-anchor="start" font-size="20" font-weight="400" fill="#1a1a1a">(muscle, nerve and other tissues)</text><defs><marker id="ahc0392b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs><line x1="95" y1="438" x2="95" y2="462" stroke="#c0392b" stroke-width="3" marker-end="url(#ahc0392b)"/><path transform="translate(60 485) scale(0.7)" d="M50 88 C20 65 0 45 4 25 C8 6 32 0 50 20 C68 0 92 6 96 25 C100 45 80 65 50 88 Z" fill="#f87171" stroke="#991b1b" stroke-width="3"/><path d="M95 493 C95 460 150 465 165 495 C180 535 150 575 95 560" fill="none" stroke="#b91c1c" stroke-width="4"/><path d="M90 495 C60 460 15 475 20 520 C25 565 70 575 90 555" fill="none" stroke="#1d4ed8" stroke-width="4"/><text x="230" y="505" text-anchor="start" font-size="24" font-weight="800" fill="#1a1a1a">4. Organ system</text><text x="230" y="537" text-anchor="start" font-size="20" font-weight="400" fill="#1a1a1a">Circulatory system</text><text x="230" y="563" text-anchor="start" font-size="20" font-weight="400" fill="#1a1a1a">(heart, blood vessels and blood)</text><defs><marker id="ahc0392b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs><line x1="95" y1="583" x2="95" y2="607" stroke="#c0392b" stroke-width="3" marker-end="url(#ahc0392b)"/><g fill="#e2e8f0" stroke="#334155" stroke-width="2.5"><circle cx="95" cy="624" r="13"/><path d="M73 642 h44 l8 52 h-12 l-6-36 v76 h-12 v-44 h-4 v44 h-12 v-76 l-6 36 h-12 z"/></g><text x="230" y="650" text-anchor="start" font-size="24" font-weight="800" fill="#1a1a1a">5. Organism</text><text x="230" y="682" text-anchor="start" font-size="20" font-weight="400" fill="#1a1a1a">A human</text>
</svg>
