<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 760 520" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Dichotomous key drawn as a branching diagram</title>
<desc id="d">The same key as the table: step 1 legs or no legs (snake), step 2 eight legs (spider) or six legs, step 3 wings (housefly) or no wings (ant).</desc>
<rect x="-40" width="760" height="520" fill="#ffffff"/>
<rect x="210.0" y="20" width="220" height="50" rx="10" fill="#e6f4f1" stroke="#0f766e" stroke-width="2.5"/><text x="320" y="52.0" text-anchor="middle" font-size="20" font-weight="600" fill="#1a1a1a">1. Legs?</text><line x1="320" y1="70" x2="170" y2="150" stroke="#222" stroke-width="2"/><text x="233.0" y="110.0" text-anchor="end" font-size="17" font-weight="700" fill="#0f766e">no legs</text><line x1="320" y1="70" x2="470" y2="150" stroke="#222" stroke-width="2"/><text x="407.0" y="110.0" text-anchor="start" font-size="17" font-weight="700" fill="#0f766e">has legs</text><rect x="85.0" y="150" width="170" height="46" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="170" y="180.0" text-anchor="middle" font-size="20" font-weight="800" fill="#1a1a1a">snake</text><rect x="360.0" y="150" width="220" height="50" rx="10" fill="#e6f4f1" stroke="#0f766e" stroke-width="2.5"/><text x="470" y="182.0" text-anchor="middle" font-size="20" font-weight="600" fill="#1a1a1a">2. How many legs?</text><line x1="470" y1="200" x2="330" y2="280" stroke="#222" stroke-width="2"/><text x="388.0" y="240.0" text-anchor="end" font-size="17" font-weight="700" fill="#0f766e">8 legs</text><line x1="470" y1="200" x2="560" y2="280" stroke="#222" stroke-width="2"/><text x="527.0" y="240.0" text-anchor="start" font-size="17" font-weight="700" fill="#0f766e">6 legs</text><rect x="245.0" y="280" width="170" height="46" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="330" y="310.0" text-anchor="middle" font-size="20" font-weight="800" fill="#1a1a1a">spider</text><rect x="470.0" y="280" width="180" height="50" rx="10" fill="#e6f4f1" stroke="#0f766e" stroke-width="2.5"/><text x="560" y="312.0" text-anchor="middle" font-size="20" font-weight="600" fill="#1a1a1a">3. Wings?</text><line x1="560" y1="330" x2="450" y2="410" stroke="#222" stroke-width="2"/><text x="493.0" y="370.0" text-anchor="end" font-size="17" font-weight="700" fill="#0f766e">has wings</text><line x1="560" y1="330" x2="620" y2="410" stroke="#222" stroke-width="2"/><text x="602.0" y="370.0" text-anchor="start" font-size="17" font-weight="700" fill="#0f766e">no wings</text><rect x="365.0" y="410" width="170" height="46" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="450" y="440.0" text-anchor="middle" font-size="20" font-weight="800" fill="#1a1a1a">housefly</text><rect x="555.0" y="410" width="170" height="46" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="640" y="440.0" text-anchor="middle" font-size="20" font-weight="800" fill="#1a1a1a">ant</text><text x="320" y="500" text-anchor="middle" font-size="18" font-weight="400" fill="#555">Each step asks about one feature, with two opposite choices.</text>
</svg>
