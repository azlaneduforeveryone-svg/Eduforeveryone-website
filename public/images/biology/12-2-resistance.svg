 fill="#fefce8" stroke="#64748b" stroke-width="3"/><ellipse cx="570" cy="88" rx="9" ry="5" fill="#dc2626"/><ellipse cx="547" cy="108" rx="9" ry="5" fill="#dc2626"/><ellipse cx="570" cy="90" rx="9" ry="5" fill="#dc2626"/><ellipse cx="537" cy="109" rx="9" ry="5" fill="#dc2626"/><ellipse cx="558" cy="128" rx="9" ry="5" fill="#dc2626"/><ellipse cx="530" cy="66" rx="9" ry="5" fill="#dc2626"/><ellipse cx="595" cy="142" rx="9" ry="5" fill="#dc2626"/><ellipse cx="519" cy="98" rx="9" ry="5" fill="#dc2626"/><ellipse cx="546" cy="135" rx="9" ry="5" fill="#dc2626"/><ellipse cx="491" cy="133" rx="9" ry="5" fill="#dc2626"/><ellipse cx="541" cy="141" rx="9" ry="5" fill="#dc2626"/><ellipse cx="559" cy="97" rx="9" ry="5" fill="#dc2626"/><ellipse cx="536" cy="127" rx="9" ry="5" fill="#dc2626"/><ellipse cx="557" cy="110" rx="9" ry="5" fill="#dc2626"/><ellipse cx="507" cy="119" rx="9" ry="5" fill="#dc2626"/><ellipse cx="561" cy="82" rx="9" ry="5" fill="#dc2626"/><ellipse cx="496" cy="126" rx="9" ry="5" fill="#dc2626"/><ellipse cx="564" cy="124" rx="9" ry="5" fill="#dc2626"/><ellipse cx="562" cy="83" rx="9" ry="5" fill="#dc2626"/><ellipse cx="521" cy="108" rx="9" ry="5" fill="#dc2626"/><ellipse cx="539" cy="76" rx="9" ry="5" fill="#dc2626"/><ellipse cx="530" cy="184" rx="9" ry="5" fill="#dc2626"/><text x="550" y="235" text-anchor="middle" font-size="18" font-weight="800" fill="#1a1a1a">3. Reproduces</text><text x="550" y="258" text-anchor="middle" font-size="15" font-weight="400" fill="#555">antibiotic no longer works</text><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="200" y1="120" x2="240" y2="120" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></mark