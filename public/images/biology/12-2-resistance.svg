<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">How antibiotic resistance develops</title>
<desc id="d">1. A chance mutation makes one bacterium resistant. 2. The antibiotic kills the other bacteria. 3. The resistant bacterium reproduces, so the antibiotic no longer works.</desc>
<rect x="0" width="660" height="320" fill="#ffffff"/>
