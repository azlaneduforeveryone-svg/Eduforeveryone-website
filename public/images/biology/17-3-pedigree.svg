<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 290" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">A pedigree diagram for an inherited condition</title>
<desc id="d">Generation I: father 1 and mother 2, neither affected, joined by a line. Generation II: their children 3 (male, unaffected), 4 (female, affected, shaded) and 5 (male, unaffected). A key shows the symbols.</desc>
<rect x="0" width="660" height="290" fill="#ffffff"/>
<text x="30" y="75" text-anchor="start" font-size="18" font-weight="700" fill="#1a1a1a">I</text><text x="30" y="235" text-anchor="start" font-size="18" font-weight="700" fill="#1a1a1a">II</text><rect x="178.0" y="48.0" width="44" height="44" fill="#fff" stroke="#222" stroke-width="2.5"/><text x="200" y="114.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">1</text><circle cx="360" cy="70" r="22.0" fill="#fff" stroke="#222" stroke-width="2.5"/><text x="360" y="114.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">2</text><line x1="222" y1="70" x2="338" y2="70" stroke="#222" stroke-width="2.5"/><line x1="280" y1="70" x2="280" y2="150" stroke="#222" stroke-width="2.5"/><line x1="160" y1="150" x2="400" y2="150" stroke="#222" stroke-width="2.5"/><line x1="160" y1="150" x2="160" y2="208" stroke="#222" stroke-width="2.5"/><line x1="280" y1="150" x2="280" y2="208" stroke="#222" stroke-width="2.5"/><line x1="400" y1="150" x2="400" y2="208" stroke="#222" stroke-width="2.5"/><rect x="138.0" y="208.0" width="44" height="44" fill="#fff" stroke="#222" stroke-width="2.5"/><text x="160" y="274.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">3</text><circle cx="280" cy="230" r="22.0" fill="#0d9488" stroke="#222" stroke-width="2.5"/><text x="280" y="274.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">4</text><rect x="378.0" y="208.0" width="44" height="44" fill="#fff" stroke="#222" stroke-width="2.5"/><text x="400" y="274.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">5</text><rect x="470" y="40" width="26" height="26" fill="#fff" stroke="#222" stroke-width="2"/><text x="506" y="59" text-anchor="start" font-size="15" font-weight="400" fill="#1a1a1a">unaffected male</text><circle cx="483" cy="100" r="13" fill="#fff" stroke="#222" stroke-width="2"/><text x="506" y="105" text-anchor="start" font-size="15" font-weight="400" fill="#1a1a1a">unaffected female</text><rect x="470" y="134" width="26" height="26" fill="#0d9488" stroke="#222" stroke-width="2"/><text x="506" y="153" text-anchor="start" font-size="15" font-weight="400" fill="#1a1a1a">affected male</text><circle cx="483" cy="194" r="13" fill="#0d9488" stroke="#222" stroke-width="2"/><text x="506" y="199" text-anchor="start" font-size="15" font-weight="400" fill="#1a1a1a">affected female</text>
</svg>
