<svg xmlns="http://www.w3.org/2000/svg" viewBox="-160 0 880 390" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Structure of a seed</title>
<desc id="d">A seed is covered by the testa. Inside is the embryo: the radicle (root), the plumule (shoot) and two cotyledons that store food.</desc>
<rect x="-160" width="880" height="390" fill="#ffffff"/>
<ellipse cx="300" cy="200" rx="200" ry="130" fill="#fef3c7" stroke="#92400e" stroke-width="6"/><path d="M300 80 C190 80 120 140 120 200 C120 260 190 320 300 320 Z" fill="#fde68a" stroke="#a16207" stroke-width="2"/><path d="M300 80 C410 80 480 140 480 200 C480 260 410 320 300 320 Z" fill="#fde68a" stroke="#a16207" stroke-width="2" opacity=".6"/><path d="M300 170 L300 250 C300 275 290 285 280 290" fill="none" stroke="#15803d" stroke-width="10" stroke-linecap="round"/><path d="M300 170 C292 150 300 135 315 128 M300 170 C310 150 300 135 287 128" fill="none" stroke="#65a30d" stroke-width="7" stroke-linecap="round"/><line x1="600" y1="90" x2="460" y2="110" stroke="#222" stroke-width="1.4"/><text x="608" y="96" text-anchor="start" font-size="20" fill="#1a1a1a">testa</text><text x="608" y="116" text-anchor="start" font-size="16" fill="#555">seed coat</text><line x1="600" y1="200" x2="470" y2="200" stroke="#222" stroke-width="1.4"/><text x="608" y="206" text-anchor="start" font-size="20" fill="#1a1a1a">cotyledon</text><text x="608" y="226" text-anchor="start" font-size="16" fill="#555">food store</text><line x1="0" y1="130" x2="295" y2="130" stroke="#222" stroke-width="1.4"/><text x="-8" y="136" text-anchor="end" font-size="20" fill="#1a1a1a">plumule</text><text x="-8" y="156" text-anchor="end" font-size="16" fill="#555">embryo shoot</text><line x1="0" y1="280" x2="282" y2="286" stroke="#222" stroke-width="1.4"/><text x="-8" y="286" text-anchor="end" font-size="20" fill="#1a1a1a">radicle</text><text x="-8" y="306" text-anchor="end" font-size="16" fill="#555">embryo root</text><text x="300" y="370" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Embryo = radicle + plumule + cotyledons</text>
</svg>
