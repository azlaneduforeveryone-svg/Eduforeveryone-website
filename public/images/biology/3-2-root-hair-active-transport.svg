<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 680 445" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Active transport in a root hair cell</title>
<desc id="d">A root hair cell in soil. Mineral ions are fewer in the soil water than inside the cell. Carrier proteins in the membrane move ions into the cell using energy released by respiration in the mitochondria.</desc>
<rect x="-10" width="680" height="445" fill="#ffffff"/>
