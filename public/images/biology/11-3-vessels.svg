<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Artery, vein and capillary compared</title>
<desc id="d">An artery has a thick wall with muscle and elastic tissue and a narrow lumen. A vein has a thin wall, wide lumen and valves. A capillary has a wall one cell thick.</desc>
<rect x="0" width="640" height="560" fill="#ffffff"/>
<circle cx="110" cy="140" r="85" fill="#fde2e2" stroke="#7f1d1d" stroke-width="2"/><circle cx="110" cy="140" r="67.5" fill="#f9a8a8" stroke="none"/><circle cx="110" cy="140" r="35" fill="#fff" stroke="#7f1d1d" stroke-width="2"/><text x="110" y="270" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">Artery</text><text x="110" y="300" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">thick wall</text><text x="110" y="324" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">lots of muscle and</text><text x="110" y="348" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">elastic tissue</text><text x="110" y="372" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">narrow lumen</text><text x="110" y="396" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">high pressure</text><path d="M330 140 m-85 0 a85 70 0 1 0 170 0 a85 70 0 1 0 -170 0" fill="#e0e7ff" stroke="#1e3a8a" stroke-width="2"/><ellipse cx="330" cy="140" rx="74" ry="59" fill="#fff" stroke="#1e3a8a" stroke-width="2"/><text x="330" y="270" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">Vein</text><text x="330" y="300" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">thin wall</text><text x="330" y="324" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">little muscle</text><text x="330" y="348" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">wide lumen</text><text x="330" y="372" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">valves</text><text x="330" y="396" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">low pressure</text><circle cx="520" cy="140" r="22" fill="#fee2e2" stroke="#7f1d1d" stroke-width="2"/><circle cx="520" cy="140" r="17" fill="#fff" stroke="#7f1d1d" stroke-width="1"/><ellipse cx="520" cy="140" rx="10" ry="8" fill="#dc2626"/><text x="520" y="270" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">Capillary</text><text x="520" y="300" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">wall one cell thick</text><text x="520" y="324" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">very narrow lumen</text><text x="520" y="348" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">(one red cell wide)</text><text x="520" y="372" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">exchange with cells</text><text x="520" y="105" text-anchor="middle" font-size="14" font-weight="400" fill="#555">(drawn larger)</text><rect x="230" y="450" width="200" height="60" fill="#e0e7ff" stroke="#1e3a8a" stroke-width="2"/><path d="M290 452 L330 480 M290 508 L330 480" stroke="#1e3a8a" stroke-width="4"/><text x="330" y="540" text-anchor="middle" font-size="16" font-weight="400" fill="#374151">Valve in a vein stops blood flowing backwards</text>
</svg>
