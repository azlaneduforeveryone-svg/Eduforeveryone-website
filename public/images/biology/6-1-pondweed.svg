ext-anchor="middle" font-size="17" font-weight="400" fill="#374151">distance from lamp (change this)</text><text x="80" y="118" text-anchor="middle" font-size="20" font-weight="400" fill="#1a1a1a">lamp</text><text x="225" y="80" text-anchor="middle" font-size="18" font-weight="400" fill="#1a1a1a">glass tank</text><text x="225" y="100" text-anchor="middle" font-size="18" font-weight="400" fill="#1a1a1a">of water</text><line x1="580" y1="100" x2="438" y2="120" stroke="#222" stroke-width="1.4"/><text x="588" y="106" text-anchor="start" font-size="20" fill="#1a1a1a">oxygen bubbles</text><line x1="580" y1="220" x2="440" y2="225" stroke="#222" stroke-width="1.4"/><text x="588" y="226" text-anchor="start" font-size="20" fill="#1a1a1a">pondweed</text><line x1="580" y1="290" x2="515" y2="290" stroke="#222" stroke-width="1.4"/><text x="588" y="296" text-anchor="start" font-size="20" fill="#1a1a1a">water with</text><text x="588" y="316" text-anchor="start" font-size="16" fill="#555">sodium hydrogencarbonate</text><text x="330" y="445" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Count the bubbles in one minute. More bubbles means a faster rate.</text>
