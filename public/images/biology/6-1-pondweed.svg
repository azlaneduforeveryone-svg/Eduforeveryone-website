<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 840 465" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Measuring the rate of photosynthesis with pondweed</title>
<desc id="d">A lamp shines on pondweed in water containing sodium hydrogencarbonate. A glass tank of water absorbs heat. Oxygen bubbles are counted at different lamp distances.</desc>
<rect x="-10" width="840" height="465" fill="#ffffff"/>
