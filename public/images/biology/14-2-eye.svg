<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 0 900 410" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">The human eye</title>
<desc id="d">Horizontal section of the eye: cornea at the front, iris around the pupil, lens held by suspensory ligaments attached to ciliary muscles, retina lining the back with the fovea, and the optic nerve leaving at the blind spot.</desc>
<rect x="-150" width="900" height="410" fill="#ffffff"/>
<circle cx="330" cy="220" r="160" fill="#fff" stroke="#475569" stroke-width="4"/><path d="M300 63 A160 160 0 1 1 300 377" fill="none" stroke="#dc2626" stroke-width="7"/><path d="M190 140 C150 180 150 260 190 300" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/><path d="M205 150 L205 200 M205 240 L205 290" stroke="#92400e" stroke-width="10"/><ellipse cx="235" cy="220" rx="20" ry="45" fill="#bae6fd" stroke="#0369a1" stroke-width="3"/><path d="M235 175 L230 105 M235 265 L230 335" stroke="#64748b" stroke-width="2"/><ellipse cx="228" cy="100" rx="18" ry="10" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/><ellipse cx="228" cy="340" rx="18" ry="10" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/><path d="M478 245 L560 260 L560 290 L475 275 Z" fill="#fde68a" stroke="#a16207" stroke-width="2"/><circle cx="489" cy="205" r="6" fill="#16a34a"/><line x1="80" y1="170" x2="168" y2="175" stroke="#222" stroke-width="1.4"/><text x="72" y="176" text-anchor="end" font-size="20" fill="#1a1a1a">cornea</text><line x1="80" y1="120" x2="205" y2="165" stroke="#222" stroke-width="1.4"/><text x="72" y="126" text-anchor="end" font-size="20" fill="#1a1a1a">iris</text><line x1="80" y1="220" x2="205" y2="222" stroke="#222" stroke-width="1.4"/><text x="72" y="226" text-anchor="end" font-size="20" fill="#1a1a1a">pupil</text><line x1="80" y1="280" x2="215" y2="240" stroke="#222" stroke-width="1.4"/><text x="72" y="286" text-anchor="end" font-size="20" fill="#1a1a1a">lens</text><line x1="80" y1="370" x2="215" y2="340" stroke="#222" stroke-width="1.4"/><text x="72" y="376" text-anchor="end" font-size="20" fill="#1a1a1a">ciliary muscle</text><line x1="80" y1="30" x2="232" y2="130" stroke="#222" stroke-width="1.4"/><text x="72" y="36" text-anchor="end" font-size="20" fill="#1a1a1a">suspensory ligaments</text><line x1="620" y1="120" x2="452" y2="140" stroke="#222" stroke-width="1.4"/><text x="628" y="126" text-anchor="start" font-size="20" fill="#1a1a1a">retina</text><line x1="620" y1="200" x2="495" y2="205" stroke="#222" stroke-width="1.4"/><text x="628" y="206" text-anchor="start" font-size="20" fill="#1a1a1a">fovea</text><line x1="620" y1="270" x2="562" y2="275" stroke="#222" stroke-width="1.4"/><text x="628" y="276" text-anchor="start" font-size="20" fill="#1a1a1a">optic nerve</text><line x1="620" y1="340" x2="478" y2="262" stroke="#222" stroke-width="1.4"/><text x="628" y="346" text-anchor="start" font-size="20" fill="#1a1a1a">blind spot</text>
