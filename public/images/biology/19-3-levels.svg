<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Population, community and ecosystem</title>
<desc id="d">A population is all the frogs in a pond. The community is all the populations (frogs, fish, plants, insects). The ecosystem is the community plus its environment.</desc>
<rect x="0" width="640" height="340" fill="#ffffff"/>
<rect x="20" y="20" width="600" height="300" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="320" y="48" text-anchor="middle" font-size="15" font-weight="700" fill="#0369a1">Ecosystem: community + environment (water, light, temperature)</text><rect x="60" y="70" width="520" height="220" rx="18" fill="#f0fdf4" stroke="#15803d" stroke-width="3" stroke-dasharray="8 6"/><text x="320" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">Community: all the populations</text><rect x="90" y="120" width="190" height="150" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="185" y="145" text-anchor="middle" font-size="15" font-weight="700" fill="#c2410c">Population: frogs</text><ellipse cx="130" cy="190" rx="16" ry="11" fill="#4ade80" stroke="#166534" stroke-width="1.5"/><ellipse cx="180" cy="175" rx="16" ry="11" fill="#4ade80" stroke="#166534" stroke-width="1.5"/><ellipse cx="230" cy="200" rx="16" ry="11" fill="#4ade80" stroke="#166534" stroke-width="1.5"/><ellipse cx="150" cy="235" rx="16" ry="11" fill="#4ade80" stroke="#166534" stroke-width="1.5"/><ellipse cx="215" cy="240" rx="16" ry="11" fill="#4ade80" stroke="#166534" stroke-width="1.5"/><path d="M340 170 q15 -12 30 0 q-15 12 -30 0 z l-10 -8 v16 z" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/><path d="M400 200 q15 -12 30 0 q-15 12 -30 0 z l-10 -8 v16 z" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/><path d="M460 160 q15 -12 30 0 q-15 12 -30 0 z l-10 -8 v16 z" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/><path d="M330 280 q-8 -40 0 -70 M330 250 q12 -8 16 -20" stroke="#15803d" stroke-width="3" fill="none"/><path d="M370 280 q-8 -40 0 -70 M370 250 q12 -8 16 -20" stroke="#15803d" stroke-width="3" fill="none"/><path d="M520 280 q-8 -40 0 -70 M520 250 q12 -8 16 -20" stroke="#15803d" stroke-width="3" fill="none"/><text x="430" y="250" text-anchor="middle" font-size="15" font-weight="400" fill="#374151">fish, plants, insects...</text>
</svg>
