<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 575" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Making human insulin with genetically modified bacteria</title>
<desc id="d">The human insulin gene is cut out and inserted into a bacterial plasmid. The plasmid is put back into a bacterium, which multiplies in a fermenter and makes human insulin.</desc>
<rect x="0" width="640" height="575" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs><rect x="15.0" y="40.0" width="190" height="60" rx="12" fill="#fce7f3" stroke="#9d174d" stroke-width="2.5"/><text x="110" y="65" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Human cell</text><text x="110" y="87" text-anchor="middle" font-size="18" font-weight="400" fill="#1a1a1a">insulin gene</text><path d="M70 120 C90 110 130 130 150 120" stroke="#9d174d" stroke-width="5" fill="none"/><rect x="95" y="112" width="30" height="14" fill="#f59e0b"/><rect x="435.0" y="40.0" width="190" height="60" rx="12" fill="#e0f2fe" stroke="#1d4ed8" stroke-width="2.5"/><text x="530" y="65" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Bacterium</text><text x="530" y="87" text-anchor="middle" font-size="18" font-weight="400" fill="#1a1a1a">has plasmids</text><circle cx="530" cy="150" r="26" fill="none" stroke="#2563eb" stroke-width="5"/><rect x="200.0" y="205.0" width="240" height="70" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="2.5"/><text x="320" y="235" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Gene inserted</text><text x="320" y="257" text-anchor="middle" font-size="18" font-weight="400" fill="#1a1a1a">into plasmid</text><circle cx="320" cy="310" r="28" fill="none" stroke="#2563eb" stroke-width="5"/><path d="M300 290 a28 28 0 0 1 20 -8" stroke="#f59e0b" stroke-width="8" fill="none"/><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="140" y1="140" x2="260" y2="205" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="510" y1="180" x2="380" y2="205" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><rect x="190.0" y="390.0" width="260" height="60" rx="12" fill="#e0f2fe" stroke="#1d4ed8" stroke-width="2.5"/><text x="320" y="415" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Plasmid put back</text><text x="320" y="437" text-anchor="middle" font-size="18" font-weight="400" fill="#1a1a1a">into bacterium</text><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="320" y1="345" x2="320" y2="385" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><rect x="160.0" y="500.0" width="320" height="60" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2.5"/><text x="320" y="525" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">Bacteria multiply in a fermenter</text><text x="320" y="547" text-anchor="middle" font-size="16" font-weight="400" fill="#1a1a1a">and make human insulin</text><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="320" y1="452" x2="320" y2="495" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><text x="140" y="155" text-anchor="middle" font-size="15" font-weight="400" fill="#555">gene cut out</text><text x="530" y="198" text-anchor="middle" font-size="15" font-weight="400" fill="#555">plasmid cut open</text>
</svg>
