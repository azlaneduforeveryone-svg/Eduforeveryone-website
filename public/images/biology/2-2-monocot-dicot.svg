<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 775" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Monocots and dicots compared</title>
<desc id="d">Monocots have parallel leaf veins, one seed leaf and flower parts in threes. Dicots have branched leaf veins, two seed leaves and flower parts in fours or fives.</desc>
<rect x="0" width="640" height="775" fill="#ffffff"/>
