<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 0 880 490" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">A reflex arc</title>
<desc id="d">A receptor in the skin sends an impulse along a sensory neurone to the spinal cord, where a relay neurone passes it to a motor neurone, which carries it to an effector muscle.</desc>
<rect x="-60" width="880" height="490" fill="#ffffff"/>
<ellipse cx="420" cy="230" rx="110" ry="130" fill="#f1f5f9" stroke="#475569" stroke-width="3"/><path d="M400 140 C380 180 380 280 400 320 L440 320 C460 280 460 180 440 140 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="420" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">spinal cord (CNS)</text><circle cx="60" cy="150" r="14" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><path d="M74 150 C200 150 280 160 360 190" fill="none" stroke="#1d4ed8" stroke-width="5"/><circle cx="250" cy="155" r="12" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><path d="M360 190 C390 205 420 215 430 230" fill="none" stroke="#7c3aed" stroke-width="5"/><path d="M430 230 C410 260 360 290 300 300 C220 312 150 315 90 320" fill="none" stroke="#dc2626" stroke-width="5"/><circle cx="430" cy="245" r="12" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><path d="M20 300 C40 280 90 285 95 320 C90 355 40 360 20 340 Z" fill="#fca5a5" stroke="#991b1b" stroke-width="2.5"/><defs><marker id="ah1d4ed8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/></marker></defs><line x1="150" y1="135" x2="210" y2="140" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ah1d4ed8)"/><defs><marker id="ahdc2626" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs><line x1="250" y1="330" x2="180" y2="334" stroke="#dc2626" stroke-width="3" marker-end="url(#ahdc2626)"/><line x1="60" y1="60" x2="60" y2="136" stroke="#222" stroke-width="1.4"/><text x="68" y="66" text-anchor="middle" font-size="20" fill="#1a1a1a">receptor</text><line x1="250" y1="60" x2="250" y2="143" stroke="#222" stroke-width="1.4"/><text x="258" y="66" text-anchor="middle" font-size="20" fill="#1a1a1a">sensory neurone</text><line x1="620" y1="170" x2="412" y2="212" stroke="#222" stroke-width="1.4"/><text x="628" y="176" text-anchor="start" font-size="20" fill="#1a1a1a">relay neurone</text><line x1="620" y1="300" x2="330" y2="296" stroke="#222" stroke-width="1.4"/><text x="628" y="306" text-anchor="start" font-size="20" fill="#1a1a1a">motor neurone</text><line x1="60" y1="420" x2="50" y2="350" stroke="#222" stroke-width="1.4"/><text x="68" y="426" text-anchor="middle" font-size="20" fill="#1a1a1a">effector (muscle)</text><text x="320" y="470" text-anchor="middle" font-size="16" font-weight="700" fill="#374151">stimulus, receptor, sensory, relay, motor, effector, response</text>
</svg>
