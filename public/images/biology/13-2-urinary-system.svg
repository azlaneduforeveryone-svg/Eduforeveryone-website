<svg xmlns="http://www.w3.org/2000/svg" viewBox="-110 0 860 470" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">The urinary system</title>
<desc id="d">Two kidneys, each joined to the aorta by a renal artery and to the vena cava by a renal vein; a ureter from each kidney to the bladder; the urethra carries urine out of the body.</desc>
<rect x="-110" width="860" height="470" fill="#ffffff"/>
