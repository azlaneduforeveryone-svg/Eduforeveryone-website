h="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker></defs><line x1="530" y1="110" x2="530" y2="72" stroke="#b91c1c" stroke-width="4" marker-end="url(#ahb91c1c)"/><defs><marker id="ah0f766e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker></defs><line x1="330" y1="170" x2="300" y2="150" stroke="#0f766e" stroke-width="3" marker-end="url(#ah0f766e)"/><defs><marker id="ah0f766e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker></defs><line x1="10" y1="170" x2="40" y2="150" stroke="#0f766e" stroke-width="3" marker-end="url(#ah0f766e)"/><defs><marker id="ah0f766e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker></defs><line x1="170" y1="360" x2="170" y2="385" stroke="#0f766e" stroke-width="3" marker-end="url(#ah0f766e)"/><text x="170" y="420" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">External intercostals contract</text><text x="530" y="420" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">External intercostals relax</text><text x="170" y="448" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">Ribs move up and out</text><text x="530" y="448" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">Ribs move down and in</text><text x="170" y="476" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">Diaphragm contracts, flattens</text><text x="530" y="476" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">Diaphragm relaxes, domes up</text><text x="170" y="504" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">Volume up, pressure down</text><text x="530" y="504" text-anchor="middle" 