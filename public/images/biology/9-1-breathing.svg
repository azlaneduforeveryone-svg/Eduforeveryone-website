<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 570" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Breathing in and breathing out</title>
<desc id="d">Breathing in: external intercostal muscles contract, ribs move up and out, diaphragm contracts and flattens, chest volume increases and pressure falls, so air moves in. Breathing out is the reverse.</desc>
<rect x="0" width="700" height="570" fill="#ffffff"/>
