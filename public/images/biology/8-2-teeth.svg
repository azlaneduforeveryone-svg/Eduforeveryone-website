ke="#a16207" stroke-width="2"/><path d="M228 340 h24 v60 l-4 40 l-4 80 h-2 l-2 -80 l-2 80 h-2 l-4 -80 l-4 -40 z" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/><path d="M240 350 v200" stroke="#7c3aed" stroke-width="2.5" fill="none"/><rect x="120" y="490" width="320" height="110" fill="#e7e5e4" fill-opacity="0.6" stroke="#78716c" stroke-width="2"/><path d="M120 430 C170 410 390 410 440 430 L440 495 L120 495 Z" fill="#fecdd3" fill-opacity="0.6" stroke="#be123c" stroke-width="2"/><line x1="460" y1="292" x2="272" y2="295" stroke="#222" stroke-width="1.4"/><text x="468" y="298" text-anchor="start" font-size="20" fill="#1a1a1a">enamel</text><line x1="460" y1="350" x2="270" y2="360" stroke="#222" stroke-width="1.4"/><text x="468" y="356" text-anchor="start" font-size="20" fill="#1a1a1a">dentine</text><line x1="460" y1="405" x2="248" y2="400" stroke="#222" stroke-width="1.4"/><text x="468" y="411" text-anchor="start" font-size="20" fill="#1a1a1a">pulp</text><line x1="460" y1="460" x2="242" y2="465" stroke="#222" stroke-width="1.4"/><text x="468" y="466" text-anchor="start" font-size="20" fill="#1a1a1a">nerves and blood vessels</text><line x1="90" y1="455" x2="212" y2="455" stroke="#222" stroke-width="1.4"/><text x="82" y="461" text-anchor="end" font-size="20" fill="#1a1a1a">gum</text><line x1="90" y1="525" x2="222" y2="525" stroke="#222" stroke-width="1.4"/><text x="82" y="531" text-anchor="end" font-size="20" fill="#1a1a1a">cement</text><line x1="90" y1="580" x2="160" y2="570" stroke="#222" stroke-width="1.4"/><text x="82" y="586" text-anchor="end" font-size="20" fill="#1a1a1a">jaw bone</text>
