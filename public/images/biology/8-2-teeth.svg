<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 0 880 620" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Types of human teeth and the structure of a tooth</title>
<desc id="d">Incisors cut, canines tear, premolars grind, molars grind and crush. A tooth has enamel on the outside, dentine, and pulp with nerves and blood vessels in the centre; cement holds it in the jaw bone, and it is embedded in the gum.</desc>
<rect x="-100" width="880" height="620" fill="#ffffff"/>
