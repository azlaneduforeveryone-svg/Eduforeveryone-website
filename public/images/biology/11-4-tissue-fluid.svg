<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 445" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Exchange between capillary, tissue fluid and cells</title>
<desc id="d">Plasma leaks out of a capillary to form tissue fluid around body cells. Oxygen and glucose diffuse from the tissue fluid into cells; carbon dioxide and wastes diffuse out of cells back into the blood.</desc>
<rect x="0" width="640" height="445" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs><rect x="20" y="40" width="600" height="80" rx="40" fill="#fee2e2" stroke="#b91c1c" stroke-width="4"/><ellipse cx="90" cy="80" rx="20" ry="14" fill="#dc2626"/><ellipse cx="190" cy="80" rx="20" ry="14" fill="#dc2626"/><ellipse cx="300" cy="80" rx="20" ry="14" fill="#dc2626"/><ellipse cx="410" cy="80" rx="20" ry="14" fill="#dc2626"/><ellipse cx="520" cy="80" rx="20" ry="14" fill="#dc2626"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#b91c1c">capillary</text><rect x="20" y="130" width="600" height="80" fill="#e0f2fe"/><text x="560" y="200" text-anchor="middle" font-size="17" font-weight="700" fill="#0369a1">tissue fluid</text><rect x="30" y="220" width="160" height="110" rx="12" fill="#fefce8" stroke="#a16207" stroke-width="2.5"/><circle cx="110" cy="275" r="16" fill="#d9c7f0" stroke="#5b3a8c" stroke-width="2"/><rect x="240" y="220" width="160" height="110" rx="12" fill="#fefce8" stroke="#a16207" stroke-width="2.5"/><circle cx="320" cy="275" r="16" fill="#d9c7f0" stroke="#5b3a8c" stroke-width="2"/><rect x="450" y="220" width="160" height="110" rx="12" fill="#fefce8" stroke="#a16207" stroke-width="2.5"/><circle cx="530" cy="275" r="16" fill="#d9c7f0" stroke="#5b3a8c" stroke-width="2"/><text x="320" y="360" text-anchor="middle" font-size="18" font-weight="700" fill="#a16207">body cells</text><defs><marker id="ah16a34a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><line x1="150" y1="110" x2="150" y2="250" stroke="#16a34a" stroke-width="4" marker-end="url(#ah16a34a)"/><text x="140" y="170" text-anchor="end" font-size="16" font-weight="700" fill="#16a34a">oxygen, glucose</text><defs><marker id="ah7c3aed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker></defs><line x1="420" y1="250" x2="420" y2="110" stroke="#7c3aed" stroke-width="4" marker-end="url(#ah7c3aed)"/><text x="430" y="170" text-anchor="start" font-size="16" font-weight="700" fill="#7c3aed">carbon dioxide, wastes</text><text x="320" y="400" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Plasma leaks out of capillaries and becomes tissue fluid.</text><text x="320" y="425" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">Substances diffuse between the tissue fluid and the cells.</text>
</svg>
