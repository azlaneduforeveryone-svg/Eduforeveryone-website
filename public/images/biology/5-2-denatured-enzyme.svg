<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 375" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">A working enzyme and a denatured enzyme</title>
<desc id="d">High temperature or the wrong pH changes the shape of the active site, so the substrate no longer fits. The enzyme is denatured, and this is permanent.</desc>
<rect x="0" width="640" height="375" fill="#ffffff"/>
<text x="160" y="34" text-anchor="middle" font-size="21" font-weight="800" fill="#0f766e">Working enzyme</text><text x="480" y="34" text-anchor="middle" font-size="21" font-weight="800" fill="#b91c1c">Denatured enzyme</text><path d="M65 170 C65 130 105 120 125 130 L140 130 L160 160 L180 130 L195 130 C225 120 255 140 255 175 C255 220 215 240 160 240 C105 240 65 220 65 170 Z" fill="#c7d2fe" stroke="#3730a3" stroke-width="3"/><path d="M140 95 L160 125 L180 95 L180 65 L140 65 Z" fill="#fde68a" stroke="#92400e" stroke-width="3"/><path d="M385 175 C380 120 420 115 440 125 C455 100 470 145 488 118 C505 98 520 140 545 128 C575 125 580 175 572 200 C565 240 520 245 480 240 C430 238 390 230 385 175 Z" fill="#c7d2fe" stroke="#3730a3" stroke-width="3"/><path d="M460 80 L480 110 L500 80 L500 50 L460 50 Z" fill="#fde68a" stroke="#92400e" stroke-width="3"/><path d="M450 60 l30 30 M480 60 l-30 30" stroke="#b91c1c" stroke-width="4" transform="translate(30 0)"/><text x="160" y="280" text-anchor="middle" font-size="18" font-weight="400" fill="#1a1a1a">Substrate fits the</text><text x="160" y="304" text-anchor="middle" font-size="18" font-weight="400" fill="#1a1a1a">active site</text><text x="480" y="280" text-anchor="middle" font-size="18" font-weight="400" fill="#1a1a1a">Active site has changed</text><text x="480" y="304" text-anchor="middle" font-size="18" font-weight="400" fill="#1a1a1a">shape: substrate cannot fit</text><defs><marker id="ahb91c1c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker></defs><line x1="270" y1="180" x2="370" y2="180" stroke="#b91c1c" stroke-width="4" marker-end="url(#ahb91c1c)"/><text x="320" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">too hot or</text><text x="320" y="215" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">wrong pH</text><text x="320" y="350" text-anchor="middle" font-size="19" font-weight="800" fill="#1a1a1a">Denaturation is permanent.</text>
</svg>
