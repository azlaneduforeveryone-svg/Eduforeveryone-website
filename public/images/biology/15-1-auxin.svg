<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 0 760 440" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">How auxin makes a shoot bend towards light</title>
<desc id="d">Light comes from one side. Auxin made in the shoot tip moves to the shaded side. Cells on the shaded side elongate more, so the shoot bends towards the light.</desc>
<rect x="-20" width="760" height="440" fill="#ffffff"/>
<circle cx="40" cy="60" r="26" fill="#fde68a" stroke="#ca8a04" stroke-width="3"/><line x1="72" y1="60" x2="84" y2="60" stroke="#f59e0b" stroke-width="3"/><line x1="63" y1="83" x2="71" y2="91" stroke="#f59e0b" stroke-width="3"/><line x1="40" y1="92" x2="40" y2="104" stroke="#f59e0b" stroke-width="3"/><line x1="17" y1="83" x2="9" y2="91" stroke="#f59e0b" stroke-width="3"/><line x1="8" y1="60" x2="-4" y2="60" stroke="#f59e0b" stroke-width="3"/><line x1="17" y1="37" x2="9" y2="29" stroke="#f59e0b" stroke-width="3"/><line x1="40" y1="28" x2="40" y2="16" stroke="#f59e0b" stroke-width="3"/><line x1="63" y1="37" x2="71" y2="29" stroke="#f59e0b" stroke-width="3"/><defs><marker id="ahf59e0b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker></defs><line x1="80" y1="80" x2="150" y2="110" stroke="#f59e0b" stroke-width="4" marker-end="url(#ahf59e0b)"/><rect x="170" y="330" width="120" height="40" fill="#a16207"/><rect x="218" y="120" width="24" height="210" rx="10" fill="#bbf7d0" stroke="#166534" stroke-width="3"/><rect x="410" y="330" width="120" height="40" fill="#a16207"/><path d="M458 330 L458 220 C458 160 430 130 400 115 L412 95 C450 115 482 150 482 220 L482 330 Z" fill="#bbf7d0" stroke="#166534" stroke-width="3"/><circle cx="240" cy="150" r="5" fill="#7c3aed"/><circle cx="240" cy="190" r="5" fill="#7c3aed"/><circle cx="240" cy="230" r="5" fill="#7c3aed"/><circle cx="240" cy="270" r="5" fill="#7c3aed"/><circle cx="470" cy="150" r="5" fill="#7c3aed"/><circle cx="470" cy="180" r="5" fill="#7c3aed"/><circle cx="482" cy="210" r="5" fill="#7c3aed"/><circle cx="482" cy="250" r="5" fill="#7c3aed"/><circle cx="482" cy="290" r="5" fill="#7c3aed"/><text x="230" y="400" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">1. Auxin collects</text><text x="230" y="422" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">on the shaded side</text><text x="470" y="400" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">2. Shaded side cells</text><text x="470" y="422" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">elongate: shoot bends</text><line x1="330" y1="60" x2="236" y2="122" stroke="#222" stroke-width="1.4"/><text x="290" y="55" text-anchor="start" font-size="20" fill="#1a1a1a">shoot tip</text><line x1="600" y1="250" x2="488" y2="250" stroke="#222" stroke-width="1.4"/><text x="608" y="256" text-anchor="start" font-size="20" fill="#1a1a1a">auxin</text><text x="608" y="276" text-anchor="start" font-size="16" fill="#555">(purple dots)</text><text x="40" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">light</text>
</svg>
