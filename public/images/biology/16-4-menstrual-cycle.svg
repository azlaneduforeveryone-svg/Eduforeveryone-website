<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 0 760 510" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">The menstrual cycle</title>
<desc id="d">Days 1 to 5: menstruation. The uterus lining then builds up until ovulation on about day 14, and stays thick until the end of the cycle. FSH matures the egg, oestrogen builds the lining, LH causes ovulation and progesterone maintains the lining.</desc>
