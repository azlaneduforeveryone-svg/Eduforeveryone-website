<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Red blood cells in different solutions</title>
<desc id="d">In pure water a red blood cell swells and may burst. In a solution like plasma it stays the same. In a concentrated solution it shrinks.</desc>
<rect x="0" width="640" height="500" fill="#ffffff"/>
<circle cx="100" cy="90" r="56" fill="#fca5a5" stroke="#991b1b" stroke-width="2.5"/><path d="M140 50 l10 -10 M148 64 l14 -4 M128 40 l4 -14" stroke="#991b1b" stroke-width="2.5"/><text x="200" y="70" text-anchor="start" font-size="22" font-weight="800" fill="#1a1a1a">In pure water</text><text x="200" y="100" text-anchor="start" font-size="18" font-weight="400" fill="#1a1a1a">Water moves in. The cell swells</text><text x="200" y="125" text-anchor="start" font-size="18" font-weight="400" fill="#1a1a1a">and may burst (no cell wall).</text><circle cx="100" cy="250" r="44" fill="#f87171" stroke="#991b1b" stroke-width="2.5"/><circle cx="100" cy="250" r="20" fill="#fca5a5"/><text x="200" y="230" text-anchor="start" font-size="22" font-weight="800" fill="#1a1a1a">In a solution like blood plasma</text><text x="200" y="260" text-anchor="start" font-size="18" font-weight="400" fill="#1a1a1a">No overall change.</text><polygon points="136.0,410.0 138.9,412.7 139.6,415.6 137.5,418.0 133.8,419.7 130.6,421.1 129.4,423.1 130.3,426.1 131.9,429.9 132.2,433.4 130.2,435.4 126.5,435.6 122.5,435.0 119.7,435.2 118.5,437.4 118.0,441.2 117.1,445.0 115.0,447.1 111.9,446.5 108.5,444.1 105.6,442.0 103.4,442.0 101.2,444.4 98.7,447.6 95.8,449.6 93.1,448.9 91.1,445.7 89.6,442.0 88.0,439.7 85.5,439.7 82.0,441.2 78.2,442.3 75.4,441.5 74.3,438.5 74.7,434.4 75.1,430.9 74.0,428.9 70.8,428.2 66.8,427.7 63.6,426.2 62.9,423.5 64.6,420.2 67.1,417.0 68.3,414.5 67.1,412.3 64.0,410.0 61.1,407.3 60.4,404.4 62.5,402.0 66.2,400.3 69.4,398.9 70.6,396.9 69.7,393.9 68.1,390.1 67.8,386.6 69.8,384.6 73.5,384.4 77.5,385.0 80.3,384.8 81.5,382.6 82.0,378.8 82.9,375.0 85.0,372.9 88.1,373.5 91.5,375.9 94.4,378.0 96.6,378.0 98.8,375.6 101.3,372.4 104.2,370.4 106.9,371.1 108.9,374.3 110.4,378.0 112.0,380.3 114.5,380.3 118.0,378.8 121.8,377.7 124.6,378.5 125.7,381.5 125.3,385.6 124.9,389.1 126.0,391.1 129.2,391.8 133.2,392.3 136.4,393.8 137.1,396.5 135.4,399.8 132.9,403.0 131.7,405.5 132.9,407.7" fill="#dc2626" stroke="#7f1d1d" stroke-width="2.5"/><text x="200" y="390" text-anchor="start" font-size="22" font-weight="800" fill="#1a1a1a">In a concentrated solution</text><text x="200" y="420" text-anchor="start" font-size="18" font-weight="400" fill="#1a1a1a">Water moves out.</text><text x="200" y="445" text-anchor="start" font-size="18" font-weight="400" fill="#1a1a1a">The cell shrinks and wrinkles.</text>
</svg>
