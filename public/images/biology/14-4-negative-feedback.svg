<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Negative feedback</title>
<desc id="d">When a level rises or falls away from the set point, receptors detect the change and effectors bring the level back to the set point.</desc>
<rect x="0" width="640" height="520" fill="#ffffff"/>
<rect x="200.0" y="32.0" width="240" height="56" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2.5"/><text x="320" y="55" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Set point</text><text x="320" y="77" text-anchor="middle" font-size="18" font-weight="400" fill="#1a1a1a">e.g. 37 °C</text><rect x="20.0" y="160.0" width="200" height="60" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/><text x="120" y="196" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Level rises</text><rect x="420.0" y="160.0" width="200" height="60" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="520" y="196" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Level falls</text><rect x="20.0" y="285.0" width="200" height="70" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/><text x="120" y="315" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Detected</text><text x="120" y="337" text-anchor="middle" font-size="18" font-weight="400" fill="#1a1a1a">by receptors</text><rect x="420.0" y="285.0" width="200" height="70" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/><text x="520" y="315" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Detected</text><text x="520" y="337" text-anchor="middle" font-size="18" font-weight="400" fill="#1a1a1a">by receptors</text><rect x="20.0" y="425.0" width="200" height="70" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/><text x="120" y="455" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Effectors</text><text x="120" y="477" text-anchor="middle" font-size="18" font-weight="400" fill="#1a1a1a">lower it</text><rect x="420.0" y="425.0" width="200" height="70" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="520" y="455" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Effectors</text><text x="520" y="477" text-anchor="middle" font-size="18" font-weight="400" fill="#1a1a1a">raise it</text><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="120" y1="222" x2="120" y2="282" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="120" y1="357" x2="120" y2="422" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="520" y1="222" x2="520" y2="282" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="520" y1="357" x2="520" y2="422" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><defs><marker id="ahb91c1c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker></defs><line x1="200" y1="90" x2="140" y2="158" stroke="#b91c1c" stroke-width="3" marker-end="url(#ahb91c1c)"/><defs><marker id="ah1d4ed8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/></marker></defs><line x1="440" y1="90" x2="500" y2="158" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ah1d4ed8)"/><path d="M220 460 C300 440 300 140 260 92" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#ahT)"/><path d="M420 460 C340 440 340 140 380 92" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#ahT)"/><defs><marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker></defs><text x="320" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#0f766e">back to</text><text x="320" y="320" text-anchor="middle" font-size="16" font-weight="700" fill="#0f766e">set point</text>
</svg>
