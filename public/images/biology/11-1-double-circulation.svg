<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 590" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">The double circulation</title>
<desc id="d">The right side of the heart pumps deoxygenated blood at low pressure to the lungs; oxygenated blood returns to the left side, which pumps it at high pressure to the body; deoxygenated blood returns to the right side.</desc>
<rect x="0" width="660" height="590" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs><rect x="210" y="40" width="220" height="90" rx="40" fill="#fdf2f8" stroke="#9d174d" stroke-width="3"/><text x="320" y="92" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">Lungs</text><rect x="210" y="440" width="220" height="90" rx="40" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="320" y="492" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">Body</text><rect x="230" y="230" width="90" height="110" rx="14" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3"/><rect x="320" y="230" width="90" height="110" rx="14" fill="#fecaca" stroke="#dc2626" stroke-width="3"/><text x="275" y="280" text-anchor="middle" font-size="18" font-weight="800" fill="#1a1a1a">right</text><text x="275" y="302" text-anchor="middle" font-size="18" font-weight="800" fill="#1a1a1a">side</text><text x="365" y="280" text-anchor="middle" font-size="18" font-weight="800" fill="#1a1a1a">left</text><text x="365" y="302" text-anchor="middle" font-size="18" font-weight="800" fill="#1a1a1a">side</text><text x="320" y="222" text-anchor="middle" font-size="20" font-weight="800" fill="#1a1a1a">Heart</text><path d="M250 230 C170 220 160 150 220 120" fill="none" stroke="#1d4ed8" stroke-width="7" marker-end="url(#ahB)"/><path d="M420 120 C480 150 470 220 390 230" fill="none" stroke="#dc2626" stroke-width="7" marker-end="url(#ahR)"/><path d="M390 340 C480 360 480 420 420 450" fill="none" stroke="#dc2626" stroke-width="7" marker-end="url(#ahR)"/><path d="M220 450 C160 420 160 360 250 340" fill="none" stroke="#1d4ed8" stroke-width="7" marker-end="url(#ahB)"/><defs><marker id="ahB" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs><text x="105" y="175" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">low pressure</text><text x="105" y="197" text-anchor="middle" font-size="17" font-weight="400" fill="#1d4ed8">to the lungs</text><text x="540" y="395" text-anchor="middle" font-size="17" font-weight="700" fill="#dc2626">high pressure</text><text x="540" y="417" text-anchor="middle" font-size="17" font-weight="400" fill="#dc2626">to the body</text><rect x="20" y="560" width="22" height="14" fill="#1d4ed8"/><text x="50" y="572" text-anchor="start" font-size="17" font-weight="400" fill="#1a1a1a">deoxygenated blood</text><rect x="330" y="560" width="22" height="14" fill="#dc2626"/><text x="360" y="572" text-anchor="start" font-size="17" font-weight="400" fill="#1a1a1a">oxygenated blood</text>
</svg>
