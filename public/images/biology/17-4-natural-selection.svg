<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Natural selection</title>
<desc id="d">Five steps: variation, many offspring, struggle for survival, better adapted individuals survive and reproduce, and they pass on their alleles. Over many generations the population evolves.</desc>
<rect x="0" width="640" height="520" fill="#ffffff"/>
<rect x="60.0" y="17.0" width="520" height="66" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/><text x="320" y="45" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">1. Variation</text><text x="320" y="67" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">rabbits differ in fur colour</text><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="320" y1="84" x2="320" y2="106" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><rect x="60.0" y="109.0" width="520" height="66" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/><text x="320" y="137" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">2. Many offspring</text><text x="320" y="159" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">more born than can survive</text><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="320" y1="176" x2="320" y2="198" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><rect x="60.0" y="201.0" width="520" height="66" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/><text x="320" y="229" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">3. Struggle</text><text x="320" y="251" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">competition; predators catch easily seen rabbits</text><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="320" y1="268" x2="320" y2="290" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><rect x="60.0" y="293.0" width="520" height="66" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2.5"/><text x="320" y="321" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">4. Better adapted survive</text><text x="320" y="343" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">camouflaged rabbits live and breed</text><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="320" y1="360" x2="320" y2="382" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><rect x="60.0" y="385.0" width="520" height="66" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2.5"/><text x="320" y="413" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">5. Pass on alleles</text><text x="320" y="435" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">next generation has more camouflaged rabbits</text><text x="320" y="500" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Repeated over many generations, the population evolves.</text>
</svg>
