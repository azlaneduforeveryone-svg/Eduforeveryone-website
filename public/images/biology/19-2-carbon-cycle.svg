<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 780 545" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">The carbon cycle</title>
<desc id="d">Plants take carbon dioxide from the air by photosynthesis. Feeding passes carbon to animals. Respiration by plants, animals and decomposers returns carbon dioxide. Some dead organisms form fossil fuels, and combustion releases carbon dioxide.</desc>
<rect x="-40" width="780" height="545" fill="#ffffff"/>
<rect x="170.0" y="22.0" width="300" height="56" rx="12" fill="#e0f2fe" stroke="#1d4ed8" stroke-width="2.5"/><text x="320" y="56" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Carbon dioxide in the air</text><rect x="25.0" y="202.0" width="170" height="56" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/><text x="110" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Plants</text><rect x="235.0" y="302.0" width="170" height="56" rx="12" fill="#fef3c7" stroke="#a16207" stroke-width="2.5"/><text x="320" y="336" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Animals</text><rect x="435.0" y="202.0" width="190" height="56" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2.5"/><text x="530" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Decomposers</text><rect x="210.0" y="442.0" width="220" height="56" rx="12" fill="#e5e7eb" stroke="#374151" stroke-width="2.5"/><text x="320" y="476" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Fossil fuels</text><defs><marker id="ah15803d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker></defs><line x1="200" y1="70" x2="120" y2="200" stroke="#15803d" stroke-width="3" marker-end="url(#ah15803d)"/><text x="95" y="120" text-anchor="end" font-size="15" font-weight="700" fill="#15803d">photosynthesis</text><defs><marker id="ahdc2626" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs><line x1="150" y1="200" x2="230" y2="80" stroke="#dc2626" stroke-width="3" marker-end="url(#ahdc2626)"/><text x="208" y="150" text-anchor="start" font-size="15" font-weight="700" fill="#dc2626">respiration</text><defs><marker id="aha16207" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a16207"/></marker></defs><line x1="190" y1="250" x2="240" y2="315" stroke="#a16207" stroke-width="3" marker-end="url(#aha16207)"/><text x="205" y="300" text-anchor="end" font-size="15" font-weight="700" fill="#a16207">feeding</text><defs><marker id="ahdc2626" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs><line x1="320" y1="300" x2="320" y2="82" stroke="#dc2626" stroke-width="3" marker-end="url(#ahdc2626)"/><text x="330" y="190" text-anchor="start" font-size="15" font-weight="700" fill="#dc2626">respiration</text><defs><marker id="ah7c3aed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker></defs><line x1="400" y1="320" x2="450" y2="255" stroke="#7c3aed" stroke-width="3" marker-end="url(#ah7c3aed)"/><text x="450" y="300" text-anchor="start" font-size="15" font-weight="700" fill="#7c3aed">death, waste</text><defs><marker id="ah7c3aed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker></defs><line x1="196" y1="232" x2="432" y2="232" stroke="#7c3aed" stroke-width="3" marker-end="url(#ah7c3aed)"/><text x="315" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3aed">death</text><defs><marker id="ahdc2626" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs><line x1="530" y1="200" x2="450" y2="80" stroke="#dc2626" stroke-width="3" marker-end="url(#ahdc2626)"/><text x="510" y="140" text-anchor="start" font-size="15" font-weight="700" fill="#dc2626">decomposition</text><text x="510" y="158" text-anchor="start" font-size="14" font-weight="400" fill="#dc2626">(respiration)</text><defs><marker id="ah374151" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker></defs><line x1="260" y1="360" x2="290" y2="440" stroke="#374151" stroke-width="3" marker-end="url(#ah374151)"/><text x="255" y="410" text-anchor="end" font-size="15" font-weight="700" fill="#374151">fossilisation</text><path d="M430 470 C600 440 640 200 470 78" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#ahc)"/><defs><marker id="ahc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs><text x="600" y="420" text-anchor="start" font-size="15" font-weight="700" fill="#dc2626">combustion</text><text x="320" y="530" text-anchor="middle" font-size="15" font-weight="400" fill="#374151">Green adds carbon to living things. Red returns CO₂ to the air.</text>
</svg>
