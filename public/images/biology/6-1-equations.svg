<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Photosynthesis equations</title>
<desc id="d">Carbon dioxide plus water gives glucose plus oxygen, using light and chlorophyll. 6CO2 + 6H2O gives C6H12O6 + 6O2.</desc>
<rect x="0" width="640" height="240" fill="#ffffff"/>
<text x="320" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#555">Word equation</text><text x="150" y="85" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">carbon dioxide + water</text><text x="490" y="85" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">glucose + oxygen</text><defs><marker id="ah0f766e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker></defs><line x1="280" y1="78" x2="360" y2="78" stroke="#0f766e" stroke-width="4" marker-end="url(#ah0f766e)"/><text x="320" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">light</text><text x="320" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">chlorophyll</text><text x="320" y="150" text-anchor="middle" font-size="19" font-weight="700" fill="#555">Balanced chemical equation</text><text x="150" y="205" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">6CO₂ + 6H₂O</text><text x="490" y="205" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">C₆H₁₂O₆ + 6O₂</text><defs><marker id="ah0f766e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker></defs><line x1="280" y1="198" x2="360" y2="198" stroke="#0f766e" stroke-width="4" marker-end="url(#ah0f766e)"/><text x="320" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">light</text><text x="320" y="223" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">chlorophyll</text>
</svg>
