<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Gas exchange in an alveolus</title>
<desc id="d">Oxygen diffuses from the air in the alveolus into the blood in the capillary. Carbon dioxide diffuses from the blood into the alveolus. Both walls are one cell thick.</desc>
<rect x="0" width="780" height="440" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs><circle cx="220" cy="210" r="140" fill="#eff6ff" stroke="#be123c" stroke-width="5"/><text x="220" y="200" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">air in alveolus</text><text x="220" y="226" text-anchor="middle" font-size="17" font-weight="400" fill="#1e3a8a">high oxygen, low CO₂</text><path d="M380 40 C360 120 360 300 380 380" fill="none" stroke="#b91c1c" stroke-width="44" stroke-linecap="round"/><path d="M380 40 C360 120 360 300 380 380" fill="none" stroke="#fecaca" stroke-width="36" stroke-linecap="round"/><ellipse cx="374" cy="90" rx="12" ry="8" fill="#dc2626" stroke="#7f1d1d" stroke-width="1"/><ellipse cx="368" cy="170" rx="12" ry="8" fill="#dc2626" stroke="#7f1d1d" stroke-width="1"/><ellipse cx="368" cy="250" rx="12" ry="8" fill="#dc2626" stroke="#7f1d1d" stroke-width="1"/><ellipse cx="374" cy="330" rx="12" ry="8" fill="#dc2626" stroke="#7f1d1d" stroke-width="1"/><defs><marker id="ah16a34a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs><line x1="300" y1="150" x2="348" y2="150" stroke="#16a34a" stroke-width="4" marker-end="url(#ah16a34a)"/><text x="300" y="135" text-anchor="middle" font-size="18" font-weight="800" fill="#16a34a">O₂</text><defs><marker id="ah7c3aed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker></defs><line x1="348" y1="270" x2="300" y2="270" stroke="#7c3aed" stroke-width="4" marker-end="url(#ah7c3aed)"/><text x="300" y="300" text-anchor="middle" font-size="18" font-weight="800" fill="#7c3aed">CO₂</text><line x1="500" y1="90" x2="392" y2="90" stroke="#222" stroke-width="1.4"/><text x="508" y="96" text-anchor="start" font-size="20" fill="#1a1a1a">capillary</text><line x1="500" y1="170" x2="378" y2="170" stroke="#222" stroke-width="1.4"/><text x="508" y="176" text-anchor="start" font-size="20" fill="#1a1a1a">red blood cell</text><line x1="500" y1="330" x2="356" y2="330" stroke="#222" stroke-width="1.4"/><text x="508" y="336" text-anchor="start" font-size="20" fill="#1a1a1a">walls one cell thick</text><line x1="500" y1="40" x2="368" y2="40" stroke="#222" stroke-width="1.4"/><text x="508" y="46" text-anchor="start" font-size="20" fill="#1a1a1a">blood from the body</text><text x="508" y="66" text-anchor="start" font-size="16" fill="#555">low oxygen, high CO₂</text><line x1="500" y1="395" x2="386" y2="385" stroke="#222" stroke-width="1.4"/><text x="508" y="401" text-anchor="start" font-size="20" fill="#1a1a1a">blood to the heart</text><text x="508" y="421" text-anchor="start" font-size="16" fill="#555">high oxygen</text>
</svg>
