<svg xmlns="http://www.w3.org/2000/svg" viewBox="-130 0 900 690" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">The main blood vessels</title>
<desc id="d">Pulmonary artery from the heart to the lungs and pulmonary vein back; aorta from the heart to the body and vena cava back; hepatic artery to the liver, hepatic vein from it, hepatic portal vein from the gut to the liver; renal artery to the kidneys and renal vein from them.</desc>
<rect x="-130" width="900" height="690" fill="#ffffff"/>
<rect x="220.0" y="20.0" width="200" height="60" rx="14" fill="#fdf2f8" stroke="#9d174d" stroke-width="2.5"/><text x="320" y="57" text-anchor="middle" font-size="20" font-weight="800" fill="#1a1a1a">Lungs</text><rect x="250" y="190" width="70" height="80" rx="10" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2.5"/><rect x="320" y="190" width="70" height="80" rx="10" fill="#fecaca" stroke="#dc2626" stroke-width="2.5"/><text x="320" y="180" text-anchor="middle" font-size="19" font-weight="800" fill="#1a1a1a">Heart</text><text x="285" y="236" text-anchor="middle" font-size="18" font-weight="800" fill="#1a1a1a">R</text><text x="355" y="236" text-anchor="middle" font-size="18" font-weight="800" fill="#1a1a1a">L</text><polyline points="280,190 280,80" fill="none" stroke="#1d4ed8" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><polyline points="360,80 360,190" fill="none" stroke="#dc2626" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><text x="272" y="130" text-anchor="end" font-size="17" font-weight="700" fill="#1d4ed8">pulmonary artery</text><text x="368" y="130" text-anchor="start" font-size="17" font-weight="700" fill="#dc2626">pulmonary vein</text><polyline points="390,240 470,240 470,640" fill="none" stroke="#dc2626" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><polyline points="170,640 170,240 250,240" fill="none" stroke="#1d4ed8" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><text x="480" y="225" text-anchor="start" font-size="17" font-weight="700" fill="#dc2626">aorta</text><text x="160" y="225" text-anchor="end" font-size="17" font-weight="700" fill="#1d4ed8">vena cava</text><rect x="245.0" y="322.0" width="150" height="56" rx="14" fill="#fef3c7" stroke="#a16207" stroke-width="2.5"/><text x="320" y="357" text-anchor="middle" font-size="20" font-weight="800" fill="#1a1a1a">Liver</text><polyline points="470,340 395,340" fill="none" stroke="#dc2626" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="245,340 170,340" fill="none" stroke="#1d4ed8" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="480" y="345" text-anchor="start" font-size="17" font-weight="700" fill="#dc2626">hepatic artery</text><text x="160" y="345" text-anchor="end" font-size="17" font-weight="700" fill="#1d4ed8">hepatic vein</text><rect x="245.0" y="432.0" width="150" height="56" rx="14" fill="#ecfccb" stroke="#4d7c0f" stroke-width="2.5"/><text x="320" y="467" text-anchor="middle" font-size="20" font-weight="800" fill="#1a1a1a">Gut</text><polyline points="470,460 395,460" fill="none" stroke="#dc2626" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="320,432 320,378" fill="none" stroke="#1d4ed8" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="330" y="410" text-anchor="start" font-size="17" font-weight="700" fill="#1d4ed8">hepatic portal vein</text><rect x="245.0" y="532.0" width="150" height="56" rx="14" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5"/><text x="320" y="567" text-anchor="middle" font-size="20" font-weight="800" fill="#1a1a1a">Kidneys</text><polyline points="470,560 395,560" fill="none" stroke="#dc2626" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="245,560 170,560" fill="none" stroke="#1d4ed8" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="480" y="565" text-anchor="start" font-size="17" font-weight="700" fill="#dc2626">renal artery</text><text x="160" y="565" text-anchor="end" font-size="17" font-weight="700" fill="#1d4ed8">renal vein</text><rect x="150.0" y="625.0" width="340" height="50" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/><text x="320" y="657" text-anchor="middle" font-size="20" font-weight="800" fill="#1a1a1a">Rest of the body</text>
</svg>
