<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Mosquito life cycle and control</title>
<desc id="d">Adult mosquitoes lay eggs on still water. Eggs hatch into larvae, which become pupae, then adults. Adults are controlled with insecticides and nets; larvae with oil on water or fish; draining still water removes breeding sites.</desc>
<rect x="0" width="640" height="440" fill="#ffffff"/>
<rect x="0" y="250" width="640" height="190" fill="#dbeafe"/><text x="600" y="430" text-anchor="end" font-size="16" font-weight="700" fill="#1d4ed8">still water</text><rect x="225.0" y="45.0" width="190" height="70" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="2.5"/><text x="320" y="75" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Adult mosquito</text><text x="320" y="97" text-anchor="middle" font-size="18" font-weight="400" fill="#1a1a1a">sprays, nets, repellent</text><rect x="445.0" y="265.0" width="190" height="70" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/><text x="540" y="295" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Eggs</text><text x="540" y="317" text-anchor="middle" font-size="18" font-weight="400" fill="#1a1a1a">laid on still water</text><rect x="225.0" y="345.0" width="190" height="70" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/><text x="320" y="375" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Larvae</text><text x="320" y="397" text-anchor="middle" font-size="18" font-weight="400" fill="#1a1a1a">oil on water, fish</text><rect x="5.0" y="265.0" width="190" height="70" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/><text x="100" y="295" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Pupae</text><text x="100" y="317" text-anchor="middle" font-size="18" font-weight="400" fill="#1a1a1a">drain still water</text><defs><marker id="ah0f766e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker></defs><line x1="420" y1="100" x2="520" y2="260" stroke="#0f766e" stroke-width="4" marker-end="url(#ah0f766e)"/><defs><marker id="ah0f766e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker></defs><line x1="450" y1="330" x2="420" y2="360" stroke="#0f766e" stroke-width="4" marker-end="url(#ah0f766e)"/><defs><marker id="ah0f766e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker></defs><line x1="220" y1="370" x2="190" y2="335" stroke="#0f766e" stroke-width="4" marker-end="url(#ah0f766e)"/><defs><marker id="ah0f766e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker></defs><line x1="120" y1="262" x2="220" y2="105" stroke="#0f766e" stroke-width="4" marker-end="url(#ah0f766e)"/><text x="320" y="200" text-anchor="middle" font-size="18" font-weight="700" fill="#b45309">Control each stage</text>
