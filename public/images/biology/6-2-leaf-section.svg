<svg xmlns="http://www.w3.org/2000/svg" viewBox="-180 0 960 445" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Section through a dicotyledonous leaf</title>
<desc id="d">From top to bottom: waxy cuticle, upper epidermis, palisade mesophyll packed with chloroplasts, spongy mesophyll with air spaces and a vascular bundle (xylem above phloem), lower epidermis with a stoma between two guard cells.</desc>
