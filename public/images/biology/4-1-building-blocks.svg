<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 610" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Small molecules join to make big molecules</title>
<desc id="d">Glucose joins to make starch, cellulose and glycogen. Amino acids join to make proteins. Glycerol and three fatty acids make a lipid. Nucleotides join to make DNA.</desc>
