<svg xmlns="http://www.w3.org/2000/svg" viewBox="-140 0 920 650" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">The endocrine glands</title>
<desc id="d">Pituitary gland in the brain (FSH and LH), adrenal glands on the kidneys (adrenaline), pancreas (insulin and glucagon), ovaries (oestrogen and progesterone) and testes (testosterone).</desc>
<rect x="-140" width="920" height="650" fill="#ffffff"/>
<path d="M300 20 C250 20 225 60 230 100 C233 130 250 150 270 160 L270 180 C200 190 170 230 165 300 L160 560 C160 600 440 600 440 560 L435 300 C430 230 400 190 330 180 L330 160 C350 150 367 130 370 100 C375 60 350 20 300 20 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="300" cy="95" r="10" fill="#a855f7" stroke="#6b21a8" stroke-width="2"/><ellipse cx="260" cy="350" rx="20" ry="30" fill="#b45309" fill-opacity=".6"/><ellipse cx="340" cy="350" rx="20" ry="30" fill="#b45309" fill-opacity=".6"/><path d="M248 322 q12 -14 24 0 z M328 322 q12 -14 24 0 z" fill="#f97316" stroke="#9a3412" stroke-width="2"/><path d="M270 295 C300 285 345 282 365 290 C360 300 320 304 280 305 Z" fill="#fde68a" stroke="#a16207" stroke-width="2"/><ellipse cx="255" cy="470" rx="12" ry="8" fill="#f9a8d4" stroke="#9d174d" stroke-width="2"/><ellipse cx="345" cy="470" rx="12" ry="8" fill="#f9a8d4" stroke="#9d174d" stroke-width="2"/><ellipse cx="275" cy="575" rx="11" ry="14" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/><ellipse cx="325" cy="575" rx="11" ry="14" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/><line x1="120" y1="95" x2="290" y2="95" stroke="#222" stroke-width="1.4"/><text x="112" y="101" text-anchor="end" font-size="20" fill="#1a1a1a">pituitary gland</text><text x="112" y="121" text-anchor="end" font-size="16" fill="#555">FSH, LH</text><line x1="480" y1="300" x2="365" y2="293" stroke="#222" stroke-width="1.4"/><text x="488" y="306" text-anchor="start" font-size="20" fill="#1a1a1a">pancreas</text><text x="488" y="326" text-anchor="start" font-size="16" fill="#555">insulin, glucagon</text><line x1="120" y1="320" x2="250" y2="322" stroke="#222" stroke-width="1.4"/><text x="112" y="326" text-anchor="end" font-size="20" fill="#1a1a1a">adrenal gland</text><text x="112" y="346" text-anchor="end" font-size="16" fill="#555">adrenaline</text><line x1="480" y1="470" x2="357" y2="470" stroke="#222" stroke-width="1.4"/><text x="488" y="476" text-anchor="start" font-size="20" fill="#1a1a1a">ovaries (female)</text><text x="488" y="496" text-anchor="start" font-size="16" fill="#555">oestrogen, progesterone</text><line x1="120" y1="575" x2="264" y2="575" stroke="#222" stroke-width="1.4"/><text x="112" y="581" text-anchor="end" font-size="20" fill="#1a1a1a">testes (male)</text><text x="112" y="601" text-anchor="end" font-size="16" fill="#555">testosterone</text><text x="300" y="630" text-anchor="middle" font-size="15" font-weight="400" fill="#555">Glands of both sexes shown on one outline</text>
