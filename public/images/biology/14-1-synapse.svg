<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">A synapse</title>
<desc id="d">An impulse arrives at the end of the first neurone, where vesicles release neurotransmitter into the synaptic gap. It diffuses across and binds to receptor proteins on the next neurone.</desc>
<rect x="0" width="640" height="400" fill="#ffffff"/>
