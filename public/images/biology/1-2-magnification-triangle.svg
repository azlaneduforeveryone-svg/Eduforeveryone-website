<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 545" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Magnification triangle</title>
<desc id="d">Triangle with I (image size) at the top and A (actual size) and M (magnification) at the bottom. Magnification equals image size divided by actual size.</desc>
<rect x="0" width="600" height="545" fill="#ffffff"/>
<polygon points="300,40 520,300 80,300" fill="#e6f4f1" stroke="#0f766e" stroke-width="4"/><line x1="165" y1="200" x2="435" y2="200" stroke="#0f766e" stroke-width="4"/><line x1="300" y1="200" x2="300" y2="300" stroke="#0f766e" stroke-width="4"/><text x="300" y="170" text-anchor="middle" font-size="56" font-weight="800" fill="#0f766e">I</text><text x="225" y="270" text-anchor="middle" font-size="50" font-weight="800" fill="#0f766e">A</text><text x="375" y="270" text-anchor="middle" font-size="50" font-weight="800" fill="#0f766e">M</text><text x="300" y="345" text-anchor="middle" font-size="20" font-weight="400" fill="#1a1a1a">I = image size</text><text x="300" y="372" text-anchor="middle" font-size="20" font-weight="400" fill="#1a1a1a">A = actual size</text><text x="300" y="399" text-anchor="middle" font-size="20" font-weight="400" fill="#1a1a1a">M = magnification</text><text x="300" y="445" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">Cover the one you want to find:</text><text x="130" y="482" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">M = I ÷ A</text><text x="300" y="482" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">I = A × M</text><text x="470" y="482" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">A = I ÷ M</text><text x="300" y="522" text-anchor="middle" font-size="20" font-weight="700" fill="#b45309">Both sizes must be in the same unit first.</text>
</svg>
