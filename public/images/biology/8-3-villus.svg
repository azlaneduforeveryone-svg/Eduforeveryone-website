<svg xmlns="http://www.w3.org/2000/svg" viewBox="-200 0 940 610" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Structure of a villus</title>
<desc id="d">A finger-shaped villus with a wall one cell thick covered in microvilli, a network of capillaries that absorb glucose and amino acids, and a central lacteal that absorbs fatty acids and glycerol.</desc>
