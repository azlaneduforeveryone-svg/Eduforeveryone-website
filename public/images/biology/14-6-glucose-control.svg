<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Control of blood glucose</title>
<desc id="d">If blood glucose is too high, the pancreas releases insulin and the liver converts glucose into glycogen, so glucose falls. If it is too low, the pancreas releases glucagon and the liver converts glycogen into glucose, so glucose rises.</desc>
<rect x="0" width="640" height="500" fill="#ffffff"/>
<rect x="180.0" y="15.0" width="280" height="50" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2.5"/><text x="320" y="46" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Normal blood glucose</text><rect x="30.0" y="112.0" width="240" height="56" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/><text x="150" y="135" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">Blood glucose too high</text><text x="150" y="157" text-anchor="middle" font-size="16" font-weight="400" fill="#1a1a1a">(after a meal)</text><rect x="370.0" y="112.0" width="240" height="56" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="490" y="135" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">Blood glucose too low</text><text x="490" y="157" text-anchor="middle" font-size="16" font-weight="400" fill="#1a1a1a">(exercise, no food)</text><rect x="30.0" y="222.0" width="240" height="56" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="2.5"/><text x="150" y="245" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Pancreas releases</text><text x="150" y="267" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">insulin</text><rect x="370.0" y="222.0" width="240" height="56" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="2.5"/><text x="490" y="245" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Pancreas releases</text><text x="490" y="267" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">glucagon</text><rect x="30.0" y="332.0" width="240" height="56" rx="12" fill="#fef9c3" stroke="#a16207" stroke-width="2.5"/><text x="150" y="355" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Liver: glucose</text><text x="150" y="377" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">into glycogen</text><rect x="370.0" y="332.0" width="240" height="56" rx="12" fill="#fef9c3" stroke="#a16207" stroke-width="2.5"/><text x="490" y="355" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Liver: glycogen</text><text x="490" y="377" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">into glucose</text><rect x="30.0" y="437.0" width="240" height="46" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/><text x="150" y="466" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Glucose falls</text><rect x="370.0" y="437.0" width="240" height="46" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/><text x="490" y="466" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Glucose rises</text><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="150" y1="170" x2="150" y2="220" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="150" y1="280" x2="150" y2="330" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="150" y1="390" x2="150" y2="435" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="490" y1="170" x2="490" y2="220" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="490" y1="280" x2="490" y2="330" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="490" y1="390" x2="490" y2="435" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><defs><marker id="ahb91c1c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker></defs><line x1="240" y1="62" x2="190" y2="110" stroke="#b91c1c" stroke-width="3" marker-end="url(#ahb91c1c)"/><defs><marker id="ah1d4ed8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/></marker></defs><line x1="400" y1="62" x2="450" y2="110" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ah1d4ed8)"/>
</svg>
