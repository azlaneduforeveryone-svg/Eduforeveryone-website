<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">The stages of eutrophication</title>
<desc id="d">Fertiliser or sewage adds nitrate; algae and plants grow fast; plants die; decomposers break them down and respire aerobically, using oxygen; dissolved oxygen falls and fish die.</desc>
<rect x="0" width="640" height="440" fill="#ffffff"/>
<rect x="100.0" y="14.0" width="440" height="52" rx="12" fill="#ffedd5" stroke="#475569" stroke-width="2.5"/><text x="320" y="46" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">1. Fertiliser or sewage adds nitrate</text><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="320" y1="66" x2="320" y2="86" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><rect x="100.0" y="86.0" width="440" height="52" rx="12" fill="#dcfce7" stroke="#475569" stroke-width="2.5"/><text x="320" y="118" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">2. Algae and plants grow fast</text><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="320" y1="138" x2="320" y2="158" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><rect x="100.0" y="158.0" width="440" height="52" rx="12" fill="#fef9c3" stroke="#475569" stroke-width="2.5"/><text x="320" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">3. Plants die (light blocked)</text><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="320" y1="210" x2="320" y2="230" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><rect x="100.0" y="230.0" width="440" height="52" rx="12" fill="#f3e8ff" stroke="#475569" stroke-width="2.5"/><text x="320" y="262" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">4. Decomposers break them down</text><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="320" y1="282" x2="320" y2="302" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><rect x="100.0" y="302.0" width="440" height="52" rx="12" fill="#f3e8ff" stroke="#475569" stroke-width="2.5"/><text x="320" y="334" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">5. Decomposers respire, using oxygen</text><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="320" y1="354" x2="320" y2="374" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><rect x="100.0" y="374.0" width="440" height="52" rx="12" fill="#fee2e2" stroke="#475569" stroke-width="2.5"/><text x="320" y="406" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">6. Oxygen falls: fish die</text>
</svg>
