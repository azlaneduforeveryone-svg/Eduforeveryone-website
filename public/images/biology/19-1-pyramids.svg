<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Pyramids of numbers, biomass and energy</title>
<desc id="d">A pyramid of numbers can be an odd shape (one oak tree feeds many caterpillars). Pyramids of biomass are usually and pyramids of energy are always pyramid-shaped.</desc>
<rect x="0" width="640" height="300" fill="#ffffff"/>
<text x="110" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#1a1a1a">Numbers</text><rect x="90.0" y="210" width="40" height="40" fill="#bbf7d0" stroke="#334155" stroke-width="1.5"/><text x="110" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">oak tree</text><rect x="20.0" y="170" width="180" height="40" fill="#fde68a" stroke="#334155" stroke-width="1.5"/><text x="110" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">caterpillars</text><rect x="65.0" y="130" width="90" height="40" fill="#fdba74" stroke="#334155" stroke-width="1.5"/><text x="110" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">birds</text><rect x="85.0" y="90" width="50" height="40" fill="#fca5a5" stroke="#334155" stroke-width="1.5"/><text x="110" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">hawk</text><text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#1a1a1a">Biomass</text><rect x="230.0" y="210" width="180" height="40" fill="#bbf7d0" stroke="#334155" stroke-width="1.5"/><text x="320" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">oak tree</text><rect x="265.0" y="170" width="110" height="40" fill="#fde68a" stroke="#334155" stroke-width="1.5"/><text x="320" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">caterpillars</text><rect x="290.0" y="130" width="60" height="40" fill="#fdba74" stroke="#334155" stroke-width="1.5"/><text x="320" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">birds</text><rect x="305.0" y="90" width="30" height="40" fill="#fca5a5" stroke="#334155" stroke-width="1.5"/><text x="320" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a"></text><text x="530" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#1a1a1a">Energy</text><rect x="440.0" y="210" width="180" height="40" fill="#bbf7d0" stroke="#334155" stroke-width="1.5"/><text x="530" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">producers</text><rect x="470.0" y="170" width="120" height="40" fill="#fde68a" stroke="#334155" stroke-width="1.5"/><text x="530" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">herbivores</text><rect x="495.0" y="130" width="70" height="40" fill="#fdba74" stroke="#334155" stroke-width="1.5"/><text x="530" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">carnivores</text><rect x="515.0" y="90" width="30" height="40" fill="#fca5a5" stroke="#334155" stroke-width="1.5"/><text x="530" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a"></text><text x="110" y="280" text-anchor="middle" font-size="15" font-weight="400" fill="#555">can be an odd shape</text><text x="320" y="280" text-anchor="middle" font-size="15" font-weight="400" fill="#555">usually a pyramid</text><text x="530" y="280" text-anchor="middle" font-size="15" font-weight="400" fill="#555">always a pyramid</text>
