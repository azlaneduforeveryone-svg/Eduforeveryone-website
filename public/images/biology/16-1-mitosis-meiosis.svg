<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Mitosis and meiosis compared</title>
<desc id="d">Mitosis: one diploid cell (46 chromosomes) makes two identical diploid cells. Meiosis: one diploid cell makes four genetically different haploid cells (23 chromosomes), the gametes.</desc>
<rect x="0" width="640" height="420" fill="#ffffff"/>
<text x="160" y="30" text-anchor="middle" font-size="24" font-weight="800" fill="#0f766e">Mitosis</text><text x="480" y="30" text-anchor="middle" font-size="24" font-weight="800" fill="#7c3aed">Meiosis</text><circle cx="160" cy="100" r="42" fill="#e0e7ff" stroke="#3730a3" stroke-width="2.5"/><text x="160" y="106" text-anchor="middle" font-size="15" font-weight="800" fill="#1a1a1a">46</text><circle cx="480" cy="100" r="42" fill="#e0e7ff" stroke="#3730a3" stroke-width="2.5"/><text x="480" y="106" text-anchor="middle" font-size="15" font-weight="800" fill="#1a1a1a">46</text><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="140" y1="145" x2="105" y2="190" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="180" y1="145" x2="215" y2="190" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><circle cx="90" cy="240" r="40" fill="#ccfbf1" stroke="#3730a3" stroke-width="2.5"/><text x="90" y="246" text-anchor="middle" font-size="15" font-weight="800" fill="#1a1a1a">46</text><circle cx="230" cy="240" r="40" fill="#ccfbf1" stroke="#3730a3" stroke-width="2.5"/><text x="230" y="246" text-anchor="middle" font-size="15" font-weight="800" fill="#1a1a1a">46</text><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="480" y1="145" x2="390" y2="190" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><circle cx="390" cy="240" r="28" fill="#f5d0fe" stroke="#3730a3" stroke-width="2.5"/><text x="390" y="246" text-anchor="middle" font-size="15" font-weight="800" fill="#1a1a1a">23</text><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="480" y1="145" x2="450" y2="190" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><circle cx="450" cy="240" r="28" fill="#fae8ff" stroke="#3730a3" stroke-width="2.5"/><text x="450" y="246" text-anchor="middle" font-size="15" font-weight="800" fill="#1a1a1a">23</text><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="480" y1="145" x2="510" y2="190" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><circle cx="510" cy="240" r="28" fill="#e9d5ff" stroke="#3730a3" stroke-width="2.5"/><text x="510" y="246" text-anchor="middle" font-size="15" font-weight="800" fill="#1a1a1a">23</text><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="480" y1="145" x2="570" y2="190" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><circle cx="570" cy="240" r="28" fill="#ddd6fe" stroke="#3730a3" stroke-width="2.5"/><text x="570" y="246" text-anchor="middle" font-size="15" font-weight="800" fill="#1a1a1a">23</text><text x="160" y="315" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">2 cells, diploid</text><text x="160" y="338" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">genetically identical</text><text x="480" y="315" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">4 cells, haploid</text><text x="480" y="338" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">genetically different</text><text x="160" y="370" text-anchor="middle" font-size="16" font-weight="400" fill="#555">growth, repair, asexual</text><text x="480" y="370" text-anchor="middle" font-size="16" font-weight="400" fill="#555">gametes</text><text x="320" y="405" text-anchor="middle" font-size="15" font-weight="400" fill="#555">Numbers show chromosomes in a human cell.</text>
</svg>
