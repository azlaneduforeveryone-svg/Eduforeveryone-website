<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 920 440" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Positions of xylem, phloem and cortex in a root and a stem</title>
<desc id="d">In a root, xylem is in the centre in a star shape with phloem between its arms, surrounded by cortex. In a stem, vascular bundles form a ring; in each bundle xylem is on the inside and phloem on the outside.</desc>
<rect x="-40" width="920" height="440" fill="#ffffff"/>
