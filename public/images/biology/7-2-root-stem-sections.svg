="2"/></g><g transform="rotate(225 437.8 127.8)"><ellipse cx="430.8" cy="127.8" rx="10" ry="14" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><ellipse cx="446.8" cy="127.8" rx="8" ry="12" fill="#fde68a" stroke="#b45309" stroke-width="2"/></g><g transform="rotate(270 500.0 102.0)"><ellipse cx="493.0" cy="102.0" rx="10" ry="14" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><ellipse cx="509.0" cy="102.0" rx="8" ry="12" fill="#fde68a" stroke="#b45309" stroke-width="2"/></g><g transform="rotate(315 562.2 127.8)"><ellipse cx="555.2" cy="127.8" rx="10" ry="14" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><ellipse cx="571.2" cy="127.8" rx="8" ry="12" fill="#fde68a" stroke="#b45309" stroke-width="2"/></g><line x1="160" y1="375" x2="160" y2="215" stroke="#222" stroke-width="1.4"/><text x="168" y="381" text-anchor="middle" font-size="20" fill="#1a1a1a">xylem</text><text x="160" y="375" text-anchor="middle" font-size="1" font-weight="400" fill="#1a1a1a"></text><line x1="20" y1="60" x2="132" y2="165" stroke="#222" stroke-width="1.4"/><text x="10" y="66" text-anchor="start" font-size="20" fill="#1a1a1a">phloem</text><line x1="20" y1="345" x2="90" y2="280" stroke="#222" stroke-width="1.4"/><text x="10" y="351" text-anchor="start" font-size="20" fill="#1a1a1a">cortex</text><line x1="650" y1="60" x2="580" y2="188" stroke="#222" stroke-width="1.4"/><text x="580" y="45" text-anchor="middle" font-size="20" fill="#1a1a1a">xylem (inside)</text><line x1="680" y1="250" x2="598" y2="192" stroke="#222" stroke-width="1.4"/><text x="688" y="256" text-anchor="start" font-size="20" fill="#1a1a1a">phloem (outside)</text><line x1="680" y1="330" x2="560" y2="240" stroke="#222" stroke-width="1.4"/><text x="688" y="336" text-anchor="start" font-size="20" fill="#1a1a1a">cortex</text><text x="330" y="420" text-anchor="middle" font-size="18" font-weight="400" fill="#374151">Xylem: blue.   Phloem: yellow.</text>
</svg>
