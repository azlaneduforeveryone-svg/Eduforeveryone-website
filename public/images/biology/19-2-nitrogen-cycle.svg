<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 0 800 510" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">The nitrogen cycle</title>
<desc id="d">Decomposers turn protein in dead organisms and waste into ammonium ions. Nitrifying bacteria turn ammonium into nitrate. Plants absorb nitrate and make amino acids and protein; animals eat and digest them. Nitrogen fixation by lightning and bacteria turns nitrogen gas into nitrogen compounds; denitrifying bacteria return nitrate to nitrogen gas.</desc>
<rect x="-30" width="800" height="510" fill="#ffffff"/>
<rect x="170.0" y="17.0" width="300" height="56" rx="12" fill="#e0f2fe" stroke="#1d4ed8" stroke-width="2.5"/><text x="320" y="51" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Nitrogen gas in the air</text><rect x="20.0" y="168.0" width="180" height="64" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/><text x="110" y="195" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">Plant protein</text><text x="110" y="217" text-anchor="middle" font-size="16" font-weight="400" fill="#1a1a1a">(amino acids)</text><rect x="20.0" y="328.0" width="180" height="64" rx="12" fill="#fef3c7" stroke="#a16207" stroke-width="2.5"/><text x="110" y="366" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">Animal protein</text><rect x="210.0" y="442.0" width="220" height="56" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2.5"/><text x="320" y="476" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">Ammonium ions</text><rect x="445.0" y="302.0" width="190" height="56" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2.5"/><text x="540" y="336" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">Nitrate ions</text><defs><marker id="aha16207" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a16207"/></marker></defs><line x1="110" y1="232" x2="110" y2="326" stroke="#a16207" stroke-width="3" marker-end="url(#aha16207)"/><text x="120" y="285" text-anchor="start" font-size="15" font-weight="700" fill="#a16207">feeding, digestion</text><defs><marker id="ah7c3aed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker></defs><line x1="150" y1="392" x2="240" y2="450" stroke="#7c3aed" stroke-width="3" marker-end="url(#ah7c3aed)"/><text x="150" y="445" text-anchor="end" font-size="15" font-weight="700" fill="#7c3aed">decomposition</text><defs><marker id="ah7c3aed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker></defs><line x1="190" y1="225" x2="250" y2="445" stroke="#7c3aed" stroke-width="2" marker-end="url(#ah7c3aed)"/><defs><marker id="ahc2410c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker></defs><line x1="430" y1="460" x2="500" y2="362" stroke="#c2410c" stroke-width="3" marker-end="url(#ahc2410c)"/><text x="475" y="430" text-anchor="start" font-size="15" font-weight="700" fill="#c2410c">nitrification</text><defs><marker id="ah15803d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker></defs><line x1="445" y1="330" x2="200" y2="215" stroke="#15803d" stroke-width="3" marker-end="url(#ah15803d)"/><text x="330" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">absorbed by plants</text><defs><marker id="ah1d4ed8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/></marker></defs><line x1="590" y1="300" x2="450" y2="75" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ah1d4ed8)"/><text x="600" y="190" text-anchor="start" font-size="15" font-weight="700" fill="#1d4ed8">denitrification</text><defs><marker id="ah0891b2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0891b2"/></marker></defs><line x1="390" y1="75" x2="510" y2="300" stroke="#0891b2" stroke-width="3" marker-end="url(#ah0891b2)"/><text x="445" y="140" text-anchor="end" font-size="15" font-weight="700" fill="#0891b2">nitrogen fixation</text><text x="445" y="158" text-anchor="end" font-size="13" font-weight="400" fill="#0891b2">(lightning, bacteria)</text>
</svg>
