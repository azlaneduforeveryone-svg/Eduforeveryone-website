<svg xmlns="http://www.w3.org/2000/svg" viewBox="-200 0 1060 545" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">A nephron and its blood vessels</title>
<desc id="d">Blood enters the glomerulus, a knot of capillaries inside the Bowman's capsule, where water, glucose, urea and ions are filtered. The liquid passes along the tubule and loop of Henle, where capillaries reabsorb useful substances, and urine leaves in the collecting duct.</desc>
<rect x="-200" width="1060" height="545" fill="#ffffff"/>
<circle cx="140" cy="120" r="55" fill="#fef9c3" stroke="#a16207" stroke-width="4"/><path d="M100 120 c0 -30 20 -30 25 -10 c5 -25 30 -25 30 0 c15 -15 30 5 15 20 c15 15 -5 35 -20 20 c-5 25 -35 20 -30 0 c-20 10 -25 -15 -20 -30z" fill="#fca5a5" stroke="#dc2626" stroke-width="3"/><path d="M60 90 L105 108" stroke="#dc2626" stroke-width="7"/><path d="M60 150 L108 132" stroke="#b91c1c" stroke-width="5"/><path d="M190 140 C260 160 260 100 320 110 C380 120 360 170 330 180 L330 420 C330 450 380 450 380 420 L380 200 C380 170 430 160 450 180 L470 200 L470 460" fill="none" stroke="#eab308" stroke-width="16" stroke-linejoin="round"/><path d="M520 60 L520 480" stroke="#ca8a04" stroke-width="22"/><path d="M470 200 C490 180 505 160 520 150" fill="none" stroke="#eab308" stroke-width="14"/><path d="M108 132 C200 200 300 200 310 230 L310 430 C320 470 395 470 400 430 L400 230 C410 200 460 230 495 210" fill="none" stroke="#f87171" stroke-width="4" stroke-dasharray="2 0"/><line x1="20" y1="40" x2="110" y2="72" stroke="#222" stroke-width="1.4"/><text x="20" y="30" text-anchor="start" font-size="20" fill="#1a1a1a">Bowman's capsule</text><line x1="-20" y1="200" x2="120" y2="140" stroke="#222" stroke-width="1.4"/><text x="-28" y="206" text-anchor="end" font-size="20" fill="#1a1a1a">glomerulus</text><line x1="-20" y1="90" x2="62" y2="92" stroke="#222" stroke-width="1.4"/><text x="-28" y="96" text-anchor="end" font-size="20" fill="#1a1a1a">blood in</text><text x="-28" y="116" text-anchor="end" font-size="16" fill="#555">(renal artery)</text><line x1="250" y1="60" x2="260" y2="118" stroke="#222" stroke-width="1.4"/><text x="258" y="66" text-anchor="middle" font-size="20" fill="#1a1a1a">tubule</text><line x1="200" y1="440" x2="330" y2="400" stroke="#222" stroke-width="1.4"/><text x="192" y="446" text-anchor="end" font-size="20" fill="#1a1a1a">loop of Henle</text><line x1="640" y1="300" x2="532" y2="300" stroke="#222" stroke-width="1.4"/><text x="648" y="306" text-anchor="start" font-size="20" fill="#1a1a1a">collecting duct</text><text x="648" y="326" text-anchor="start" font-size="16" fill="#555">urine to ureter</text><line x1="640" y1="420" x2="405" y2="430" stroke="#222" stroke-width="1.4"/><text x="648" y="426" text-anchor="start" font-size="20" fill="#1a1a1a">capillaries</text><text x="648" y="446" text-anchor="start" font-size="16" fill="#555">reabsorb glucose, ions, water</text><text x="330" y="520" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Filtration in the glomerulus, then reabsorption along the tubule.</text>
