<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 615" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Plant cells: turgid, flaccid and plasmolysed</title>
<desc id="d">Three plant cells. Turgid: vacuole full and cytoplasm pressed against the cell wall. Flaccid: cell soft. Plasmolysed: membrane and cytoplasm pulled away from the cell wall.</desc>
<rect x="0" width="640" height="615" fill="#ffffff"/>
<rect x="30" y="20" width="150" height="120" rx="8" fill="#e3efc9" stroke="#4d6b1f" stroke-width="5"/><rect x="37" y="27" width="136" height="106" rx="6" fill="#f4f9e8" stroke="#7a4a1e" stroke-width="2"/><rect x="48" y="38" width="114" height="84" rx="14" fill="#bfdbfe" stroke="#2b7fae" stroke-width="2"/><text x="210" y="48" text-anchor="start" font-size="24" font-weight="800" fill="#1a1a1a">Turgid</text><text x="210" y="78" text-anchor="start" font-size="18" font-weight="400" fill="#1a1a1a">In water: water moves in.</text><text x="210" y="103" text-anchor="start" font-size="18" font-weight="400" fill="#1a1a1a">Vacuole full, cytoplasm pushed</text><text x="210" y="128" text-anchor="start" font-size="18" font-weight="400" fill="#1a1a1a">against the wall. Cell is firm.</text><rect x="30" y="190" width="150" height="120" rx="8" fill="#e3efc9" stroke="#4d6b1f" stroke-width="5"/><path d="M38 200 Q105 208 172 200 Q164 250 172 300 Q105 292 38 300 Q46 250 38 200 Z" fill="#f4f9e8" stroke="#7a4a1e" stroke-width="2"/><rect x="60" y="220" width="90" height="60" rx="16" fill="#dbeafe" stroke="#2b7fae" stroke-width="2"/><text x="210" y="218" text-anchor="start" font-size="24" font-weight="800" fill="#1a1a1a">Flaccid</text><text x="210" y="248" text-anchor="start" font-size="18" font-weight="400" fill="#1a1a1a">In a slightly concentrated solution:</text><text x="210" y="273" text-anchor="start" font-size="18" font-weight="400" fill="#1a1a1a">water moves out. Cell is soft.</text><rect x="30" y="360" width="150" height="120" rx="8" fill="#e3efc9" stroke="#4d6b1f" stroke-width="5"/><path d="M65 385 C110 375 155 390 150 420 C155 455 110 465 70 455 C52 440 52 400 65 385 Z" fill="#f4f9e8" stroke="#7a4a1e" stroke-width="2"/><ellipse cx="105" cy="420" rx="24" ry="18" fill="#dbeafe" stroke="#2b7fae" stroke-width="2"/><text x="210" y="388" text-anchor="start" font-size="24" font-weight="800" fill="#1a1a1a">Plasmolysed</text><text x="210" y="418" text-anchor="start" font-size="18" font-weight="400" fill="#1a1a1a">In a very concentrated solution:</text><text x="210" y="443" text-anchor="start" font-size="18" font-weight="400" fill="#1a1a1a">membrane and cytoplasm pull</text><text x="210" y="468" text-anchor="start" font-size="18" font-weight="400" fill="#1a1a1a">away from the cell wall.</text><line x1="105" y1="545" x2="62" y2="478" stroke="#222" stroke-width="1.4"/><text x="113" y="551" text-anchor="start" font-size="18" fill="#1a1a1a"></text><text x="30" y="575" text-anchor="start" font-size="17" font-weight="700" fill="#7a4a1e">Gap between wall and membrane</text><text x="30" y="598" text-anchor="start" font-size="17" font-weight="400" fill="#555">is filled with the outside solution.</text>
</svg>
