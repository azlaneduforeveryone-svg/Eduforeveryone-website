<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 365" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Vasodilation and vasoconstriction</title>
<desc id="d">When too hot, arterioles supplying skin capillaries widen so more blood flows near the surface and more heat is lost. When too cold, they narrow so less heat is lost.</desc>
<rect x="0" width="680" height="365" fill="#ffffff"/>
<rect x="20" y="60" width="300" height="200" rx="10" fill="#fef3e2" stroke="#e5e7eb"/><rect x="20" y="60" width="300" height="30" fill="#fde7d4"/><path d="M40 230 L110 230 L110 110 C110 95 230 95 230 110 L230 230 L300 230" fill="none" stroke="#dc2626" stroke-width="10"/><path d="M40 245 L300 245" stroke="#991b1b" stroke-width="8"/><defs><marker id="ahf97316" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f97316"/></marker></defs><line x1="130" y1="60" x2="130" y2="25" stroke="#f97316" stroke-width="3" marker-end="url(#ahf97316)"/><defs><marker id="ahf97316" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f97316"/></marker></defs><line x1="170" y1="60" x2="170" y2="25" stroke="#f97316" stroke-width="3" marker-end="url(#ahf97316)"/><defs><marker id="ahf97316" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f97316"/></marker></defs><line x1="210" y1="60" x2="210" y2="25" stroke="#f97316" stroke-width="3" marker-end="url(#ahf97316)"/><rect x="360" y="60" width="300" height="200" rx="10" fill="#fef3e2" stroke="#e5e7eb"/><rect x="360" y="60" width="300" height="30" fill="#fde7d4"/><path d="M380 230 L450 230 L450 110 C450 95 570 95 570 110 L570 230 L640 230" fill="none" stroke="#dc2626" stroke-width="3"/><path d="M380 245 L640 245" stroke="#991b1b" stroke-width="8"/><text x="170" y="300" text-anchor="middle" font-size="19" font-weight="800" fill="#b91c1c">Too hot: vasodilation</text><text x="170" y="325" text-anchor="middle" font-size="16" font-weight="400" fill="#1a1a1a">arterioles widen, more blood</text><text x="170" y="346" text-anchor="middle" font-size="16" font-weight="400" fill="#1a1a1a">near surface, more heat lost</text><text x="510" y="300" text-anchor="middle" font-size="19" font-weight="800" fill="#1d4ed8">Too cold: vasoconstriction</text><text x="510" y="325" text-anchor="middle" font-size="16" font-weight="400" fill="#1a1a1a">arterioles narrow, less blood</text><text x="510" y="346" text-anchor="middle" font-size="16" font-weight="400" fill="#1a1a1a">near surface, less heat lost</text><text x="170" y="20" text-anchor="middle" font-size="15" font-weight="700" fill="#c2410c">heat lost</text>
</svg>
