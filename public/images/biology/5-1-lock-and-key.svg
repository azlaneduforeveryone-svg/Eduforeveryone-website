<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1020" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">How an enzyme works: lock and key</title>
<desc id="d">1. The substrate has a shape complementary to the enzyme's active site. 2. It fits and forms an enzyme-substrate complex. 3. Products leave and the enzyme is unchanged. A molecule with a different shape does not fit.</desc>
<rect x="0" width="640" height="1020" fill="#ffffff"/>
<text x="320" y="30" text-anchor="middle" font-size="20" font-weight="800" fill="#1a1a1a">1. Substrate and enzyme</text><path d="M110 160 C110 120 150 110 170 120 L185 120 L205 150 L225 120 L240 120 C270 110 300 130 300 165 C300 210 260 230 205 230 C150 230 110 210 110 160 Z" fill="#c7d2fe" stroke="#3730a3" stroke-width="3"/><path d="M185 85 L205 115 L225 85 L225 55 L185 55 Z" fill="#fde68a" stroke="#92400e" stroke-width="3"/><line x1="380" y1="80" x2="227" y2="70" stroke="#222" stroke-width="1.4"/><text x="388" y="86" text-anchor="start" font-size="19" fill="#1a1a1a">substrate</text><line x1="380" y1="145" x2="205" y2="135" stroke="#222" stroke-width="1.4"/><text x="388" y="151" text-anchor="start" font-size="19" fill="#1a1a1a">active site</text><line x1="380" y1="205" x2="250" y2="200" stroke="#222" stroke-width="1.4"/><text x="388" y="211" text-anchor="start" font-size="19" fill="#1a1a1a">enzyme</text><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="320" y1="248" x2="320" y2="282" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><text x="320" y="305" text-anchor="middle" font-size="20" font-weight="800" fill="#1a1a1a">2. Enzyme-substrate complex</text><path d="M110 410 C110 370 150 360 170 370 L185 370 L205 400 L225 370 L240 370 C270 360 300 380 300 415 C300 460 260 480 205 480 C150 480 110 460 110 410 Z" fill="#c7d2fe" stroke="#3730a3" stroke-width="3"/><path d="M185 370 L205 400 L225 370 L225 340 L185 340 Z" fill="#fde68a" stroke="#92400e" stroke-width="3"/><text x="450" y="410" text-anchor="middle" font-size="18" font-weight="400" fill="#1a1a1a">The substrate fits</text><text x="450" y="434" text-anchor="middle" font-size="18" font-weight="400" fill="#1a1a1a">exactly: the shapes</text><text x="450" y="458" text-anchor="middle" font-size="18" font-weight="400" fill="#1a1a1a">are complementary.</text><defs><marker id="ah475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><line x1="320" y1="498" x2="320" y2="532" stroke="#475569" stroke-width="3" marker-end="url(#ah475569)"/><text x="320" y="555" text-anchor="middle" font-size="20" font-weight="800" fill="#1a1a1a">3. Products leave, enzyme is unchanged</text><path d="M110 680 C110 640 150 630 170 640 L185 640 L205 670 L225 640 L240 640 C270 630 300 650 300 685 C300 730 260 750 205 750 C150 750 110 730 110 680 Z" fill="#c7d2fe" stroke="#3730a3" stroke-width="3"/><path d="M150 600 L170 600 L170 570 L150 570 Z" fill="#fde68a" stroke="#92400e" stroke-width="3" transform="rotate(-20 160 585)"/><path d="M240 600 L260 600 L260 570 L240 570 Z" fill="#fde68a" stroke="#92400e" stroke-width="3" transform="rotate(20 250 585)"/><line x1="380" y1="585" x2="262" y2="585" stroke="#222" stroke-width="1.4"/><text x="388" y="591" text-anchor="start" font-size="19" fill="#1a1a1a">products</text><line x1="20" y1="780" x2="620" y2="780" stroke="#e5e7eb" stroke-width="2"/><text x="320" y="815" text-anchor="middle" font-size="20" font-weight="800" fill="#b91c1c">A different molecule does not fit</text><path d="M110 930 C110 890 150 880 170 890 L185 890 L205 920 L225 890 L240 890 C270 880 300 900 300 935 C300 980 260 1000 205 1000 C150 1000 110 980 110 930 Z" fill="#c7d2fe" stroke="#3730a3" stroke-width="3"/><circle cx="205" cy="840" r="22" fill="#bbf7d0" stroke="#166534" stroke-width="3"/><path d="M190 825 l30 30 M220 825 l-30 30" stroke="#b91c1c" stroke-width="4"/><text x="450" y="900" text-anchor="middle" font-size="18" font-weight="400" fill="#1a1a1a">Wrong shape, so no</text><text x="450" y="924" text-anchor="middle" font-size="18" font-weight="400" fill="#1a1a1a">reaction. Each enzyme</text><text x="450" y="948" text-anchor="middle" font-size="18" font-weight="400" fill="#1a1a1a">is specific.</text>
</svg>
