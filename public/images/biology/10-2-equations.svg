<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 235" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Aerobic respiration equations</title>
<desc id="d">Glucose plus oxygen gives carbon dioxide plus water, releasing energy. C6H12O6 + 6O2 gives 6CO2 + 6H2O.</desc>
<rect x="0" width="640" height="235" fill="#ffffff"/>
<text x="320" y="35" text-anchor="middle" font-size="19" font-weight="700" fill="#555">Word equation</text><text x="150" y="85" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">glucose + oxygen</text><text x="490" y="85" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">carbon dioxide + water</text><defs><marker id="ah0f766e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker></defs><line x1="280" y1="78" x2="360" y2="78" stroke="#0f766e" stroke-width="4" marker-end="url(#ah0f766e)"/><text x="320" y="63" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">energy released</text><text x="320" y="155" text-anchor="middle" font-size="19" font-weight="700" fill="#555">Balanced chemical equation</text><text x="150" y="205" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">C₆H₁₂O₆ + 6O₂</text><text x="490" y="205" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">6CO₂ + 6H₂O</text><defs><marker id="ah0f766e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker></defs><line x1="280" y1="198" x2="360" y2="198" stroke="#0f766e" stroke-width="4" marker-end="url(#ah0f766e)"/><text x="320" y="183" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">energy released</text>
</svg>
