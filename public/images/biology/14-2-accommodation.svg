<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Accommodation</title>
<desc id="d">For a distant object the ciliary muscles relax, the suspensory ligaments are tight and the lens is thin. For a near object the ciliary muscles contract, the ligaments slacken and the lens becomes fatter, refracting light more.</desc>
<rect x="0" width="680" height="410" fill="#ffffff"/>
<circle cx="230" cy="150" r="90" fill="#fff" stroke="#475569" stroke-width="3"/><ellipse cx="170" cy="150" rx="12" ry="45" fill="#bae6fd" stroke="#0369a1" stroke-width="3"/><path d="M170 105 L166 70 M170 195 L166 230" stroke="#64748b" stroke-width="3" /><ellipse cx="166" cy="66" rx="16" ry="8" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/><ellipse cx="166" cy="234" rx="16" ry="8" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/><path d="M50 120 L170 120 L318 150 M50 180 L170 180 L318 150" fill="none" stroke="#f59e0b" stroke-width="2.5"/><circle cx="560" cy="150" r="90" fill="#fff" stroke="#475569" stroke-width="3"/><ellipse cx="500" cy="150" rx="26" ry="45" fill="#bae6fd" stroke="#0369a1" stroke-width="3"/><path d="M500 105 L496 70 M500 195 L496 230" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/><ellipse cx="496" cy="66" rx="16" ry="12" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/><ellipse cx="496" cy="234" rx="16" ry="12" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/><path d="M380 150 L500 120 L648 150 M380 150 L500 180 L648 150" fill="none" stroke="#f59e0b" stroke-width="2.5"/><text x="190" y="30" text-anchor="middle" font-size="21" font-weight="800" fill="#1a1a1a">Distant object</text><text x="520" y="30" text-anchor="middle" font-size="21" font-weight="800" fill="#1a1a1a">Near object</text><text x="20" y="290" text-anchor="start" font-size="17" font-weight="700" fill="#1a1a1a">Ciliary muscles</text><text x="240" y="290" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">relax</text><text x="560" y="290" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">contract</text><text x="20" y="320" text-anchor="start" font-size="17" font-weight="700" fill="#1a1a1a">Suspensory ligaments</text><text x="240" y="320" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">tight</text><text x="560" y="320" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">slack</text><text x="20" y="350" text-anchor="start" font-size="17" font-weight="700" fill="#1a1a1a">Lens</text><text x="240" y="350" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">thin</text><text x="560" y="350" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">fat</text><text x="20" y="380" text-anchor="start" font-size="17" font-weight="700" fill="#1a1a1a">Refraction</text><text x="240" y="380" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">less</text><text x="560" y="380" text-anchor="middle" font-size="17" font-weight="400" fill="#1a1a1a">more</text>
</svg>
