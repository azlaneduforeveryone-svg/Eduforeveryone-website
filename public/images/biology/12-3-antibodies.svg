<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 880 370" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Antibodies fit specific antigens</title>
<desc id="d">A pathogen has antigens with specific shapes on its surface. An antibody with a complementary shape binds to its antigen; an antibody with the wrong shape does not fit.</desc>
<rect x="-40" width="880" height="370" fill="#ffffff"/>
<circle cx="320" cy="200" r="80" fill="#fde68a" stroke="#a16207" stroke-width="3"/><text x="320" y="207" text-anchor="middle" font-size="18" font-weight="800" fill="#1a1a1a">pathogen</text><g transform="rotate(90 400.0 200.0)"><path d="M390.0 200.0 l10 -16 l10 16 z" fill="#f59e0b" stroke="#92400e" stroke-width="2"/></g><circle cx="385.1" cy="265.1" r="9" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><g transform="rotate(180 320.0 280.0)"><path d="M310.0 280.0 l10 -16 l10 16 z" fill="#f59e0b" stroke="#92400e" stroke-width="2"/></g><circle cx="254.9" cy="265.1" r="9" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><g transform="rotate(270 240.0 200.0)"><path d="M230.0 200.0 l10 -16 l10 16 z" fill="#f59e0b" stroke="#92400e" stroke-width="2"/></g><circle cx="254.9" cy="134.9" r="9" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><g transform="rotate(360 320.0 120.0)"><path d="M310.0 120.0 l10 -16 l10 16 z" fill="#f59e0b" stroke="#92400e" stroke-width="2"/></g><circle cx="385.1" cy="134.9" r="9" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><g transform="translate(445 200) rotate(90)"><path d="M0 0 v40 M0 0 l-22 -26 M0 0 l22 -26" stroke="#7c3aed" stroke-width="8" stroke-linecap="round"/></g><g transform="translate(150 160) rotate(-30)"><path d="M0 0 v40 M0 0 l-22 -26 M0 0 l22 -26" stroke="#7c3aed" stroke-width="8" stroke-linecap="round"/><path d="M-22 -26 l-6 -8 l12 0 z M22 -26 l-6 -8 l12 0z" fill="#7c3aed"/></g><line x1="560" y1="120" x2="412" y2="190" stroke="#222" stroke-width="1.4"/><text x="568" y="126" text-anchor="start" font-size="20" fill="#1a1a1a">antigen</text><text x="568" y="146" text-anchor="start" font-size="16" fill="#555">specific shape</text><line x1="560" y1="260" x2="470" y2="205" stroke="#222" stroke-width="1.4"/><text x="568" y="266" text-anchor="start" font-size="20" fill="#1a1a1a">antibody</text><text x="568" y="286" text-anchor="start" font-size="16" fill="#555">complementary shape, fits</text><text x="150" y="260" text-anchor="middle" font-size="16" font-weight="700" fill="#b91c1c">wrong shape:</text><text x="150" y="280" text-anchor="middle" font-size="16" font-weight="400" fill="#b91c1c">does not fit</text><text x="320" y="350" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Antibodies destroy the pathogen or mark it for phagocytes.</text>
</svg>
