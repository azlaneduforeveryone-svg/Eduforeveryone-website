<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Food tests and their colour changes</title>
<desc id="d">Starch: iodine turns from orange-brown to blue-black. Glucose and maltose: Benedict's solution, heated, turns from blue to brick-red. Protein: biuret turns from blue to purple. Lipids: ethanol then water gives a cloudy white emulsion.</desc>
