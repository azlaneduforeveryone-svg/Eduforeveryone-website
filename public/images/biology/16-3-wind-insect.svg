<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Insect-pollinated and wind-pollinated flowers</title>
<desc id="d">An insect-pollinated flower has large bright petals with anthers and stigma inside. A wind-pollinated flower has small dull parts, anthers hanging outside and large feathery stigmas.</desc>
<rect x="0" width="860" height="440" fill="#ffffff"/>
<text x="160" y="30" text-anchor="middle" font-size="21" font-weight="800" fill="#9d174d">Insect-pollinated</text><text x="500" y="30" text-anchor="middle" font-size="21" font-weight="800" fill="#15803d">Wind-pollinated</text><path d="M160 350 L160 250" stroke="#15803d" stroke-width="8"/><path d="M150 250 C80 230 60 140 110 90 C130 150 150 200 155 240 Z M170 250 C240 230 260 140 210 90 C190 150 170 200 165 240 Z" fill="#f9a8d4" stroke="#9d174d" stroke-width="2"/><path d="M160 250 L160 170" stroke="#047857" stroke-width="5"/><circle cx="160" cy="166" r="7" fill="#10b981"/><path d="M152 240 L140 190 M168 240 L180 190" stroke="#a16207" stroke-width="2.5"/><ellipse cx="139" cy="185" rx="6" ry="9" fill="#facc15"/><ellipse cx="181" cy="185" rx="6" ry="9" fill="#facc15"/><path d="M500 350 L500 120" stroke="#65a30d" stroke-width="6"/><path d="M500 160 C485 145 480 140 478 135" fill="none" stroke="#a3a3a3" stroke-width="2"/><path d="M496 158 L450 180" stroke="#a16207" stroke-width="1.5"/><rect x="445" y="180" width="10" height="20" fill="#fde047" stroke="#a16207" stroke-width="1"/><path d="M500 160 C515 145 520 140 522 135" fill="none" stroke="#a3a3a3" stroke-width="2"/><path d="M504 158 L550 180" stroke="#a16207" stroke-width="1.5"/><rect x="545" y="180" width="10" height="20" fill="#fde047" stroke="#a16207" stroke-width="1"/><path d="M500 158 l-26 -36 m26 36 l-14 -40 m14 40 l14 -40 m-14 40 l26 -36" stroke="#a3e635" stroke-width="2"/><path d="M500 210 C485 195 480 190 478 185" fill="none" stroke="#a3a3a3" stroke-width="2"/><path d="M496 208 L450 230" stroke="#a16207" stroke-width="1.5"/><rect x="445" y="230" width="10" height="20" fill="#fde047" stroke="#a16207" stroke-width="1"/><path d="M500 210 C515 195 520 190 522 185" fill="none" stroke="#a3a3a3" stroke-width="2"/><path d="M504 208 L550 230" stroke="#a16207" stroke-width="1.5"/><rect x="545" y="230" width="10" height="20" fill="#fde047" stroke="#a16207" stroke-width="1"/><path d="M500 208 l-26 -36 m26 36 l-14 -40 m14 40 l14 -40 m-14 40 l26 -36" stroke="#a3e635" stroke-width="2"/><path d="M500 260 C485 245 480 240 478 235" fill="none" stroke="#a3a3a3" stroke-width="2"/><path d="M496 258 L450 280" stroke="#a16207" stroke-width="1.5"/><rect x="445" y="280" width="10" height="20" fill="#fde047" stroke="#a16207" stroke-width="1"/><path d="M500 260 C515 245 520 240 522 235" fill="none" stroke="#a3a3a3" stroke-width="2"/><path d="M504 258 L550 280" stroke="#a16207" stroke-width="1.5"/><rect x="545" y="280" width="10" height="20" fill="#fde047" stroke="#a16207" stroke-width="1"/><path d="M500 258 l-26 -36 m26 36 l-14 -40 m14 40 l14 -40 m-14 40 l26 -36" stroke="#a3e635" stroke-width="2"/><line x1="330" y1="95" x2="215" y2="110" stroke="#222" stroke-width="1.4"/><text x="246" y="80" text-anchor="start" font-size="20" fill="#1a1a1a">large bright petals</text><text x="160" y="400" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">sticky, spiky pollen</text><text x="160" y="422" text-anchor="middle" font-size="16" font-weight="400" fill="#1a1a1a">anthers and stigma inside</text><text x="500" y="400" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">light, smooth pollen</text><text x="500" y="422" text-anchor="middle" font-size="16" font-weight="400" fill="#1a1a1a">anthers and feathery stigmas hang out</text><line x1="660" y1="180" x2="528" y2="152" stroke="#222" stroke-width="1.4"/><text x="668" y="186" text-anchor="start" font-size="20" fill="#1a1a1a">feathery stigma</text><line x1="660" y1="260" x2="555" y2="262" stroke="#222" stroke-width="1.4"/><text x="668" y="266" text-anchor="start" font-size="20" fill="#1a1a1a">anther hangs out</text>
</svg>
