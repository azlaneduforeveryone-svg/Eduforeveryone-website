<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 365" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">The ambiguous case of the sine rule</title>
<desc id="d">Angle A is 40 degrees and AC is 9 cm. A side of 7 cm from C can reach the base line at two points, B1 and B2, so two different triangles are possible.</desc>
<rect x="0" width="480" height="365" fill="#ffffff"/>
<line x1="50.0" y1="300.0" x2="360.9" y2="300.0" stroke="#222" stroke-width="2" stroke-linecap="round"/><path d="M365.7,255.7 A175,175 0 0 1 79.0,255.7" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 5"/><polygon points="50.0,300.0 320.9,300.0 222.4,155.4" fill="#0d9488" fill-opacity="0.08" stroke="#0d9488" stroke-width="2.5" stroke-linejoin="round"/><line x1="222.4" y1="155.4" x2="123.8" y2="300.0" stroke="#b7791f" stroke-width="3" stroke-linecap="round"/><path d="M80.6,274.3 A40,40 0 0 1 90.0,300.0" fill="none" stroke="#222" stroke-width="2"/><text x="106.4" y="284.5" text-anchor="middle" font-size="14" font-weight="700" fill="#222">40°</text><circle cx="123.8" cy="300.0" r="4" fill="#b7791f"/><circle cx="320.9" cy="300.0" r="4" fill="#0d9488"/><text x="42" y="322" text-anchor="middle" font-size="18" font-weight="700" fill="#222">A</text><text x="222.4" y="143.4" text-anchor="middle" font-size="18" font-weight="700" fill="#222">C</text><text x="123.8" y="324" text-anchor="middle" font-size="18" font-weight="700" fill="#b7791f">B₁</text><text x="320.9" y="324" text-anchor="middle" font-size="18" font-weight="700" fill="#0d9488">B₂</text><text x="124.2" y="223.7" text-anchor="end" font-size="15" font-weight="700" fill="#222">9 cm</text><text x="283.6" y="227.7" text-anchor="start" font-size="15" font-weight="700" fill="#0d9488">7 cm</text><text x="161.1" y="257.7" text-anchor="end" font-size="15" font-weight="700" fill="#b7791f">7 cm</text><text x="250" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Side a = 7 cm can swing to B₁ or B₂</text>
</svg>
