<title id="t">Corresponding, alternate and co-interior angles</title>
<desc id="d">Three diagrams of a line crossing two parallel lines. Corresponding angles are in matching positions and are equal. Alternate angles are on opposite sides of the crossing line, between the parallel lines, and are equal. Co-interior angles are on the same side, between the parallel lines, and add up to 180 degrees.</desc>
