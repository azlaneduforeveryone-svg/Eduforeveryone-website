<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 365" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Bearing of B from A, and of A from B</title>
<desc id="d">North lines at A and B. From A, the angle clockwise from north to B is 25 degrees, so the bearing of B from A is 025. From B, the angle clockwise from north round to A is 205 degrees.</desc>
<rect x="0" width="560" height="365" fill="#ffffff"/>
<line x1="140.0" y1="300.0" x2="140.0" y2="100.0" stroke="#222" stroke-width="2" stroke-linecap="round"/><text x="140" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#222">N</text><line x1="228.7" y1="109.7" x2="228.7" y2="39.7" stroke="#222" stroke-width="2" stroke-linecap="round"/><text x="228.7" y="31.7" text-anchor="middle" font-size="16" font-weight="700" fill="#222">N</text><line x1="228.7" y1="109.7" x2="228.7" y2="199.7" stroke="#222" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="140.0" y1="300.0" x2="228.7" y2="109.7" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/><path d="M140.0,245.0 A55,55 0 0 1 163.2,250.2" fill="none" stroke="#c0392b" stroke-width="2.2"/><text x="176" y="258" text-anchor="start" font-size="15" font-weight="700" fill="#c0392b">025°</text><path d="M228.7,75.7 A34,34 0 1 1 214.4,140.5" fill="none" stroke="#b7791f" stroke-width="2.2"/><text x="270.7" y="149.7" text-anchor="start" font-size="15" font-weight="700" fill="#b7791f">205°</text><circle cx="140.0" cy="300.0" r="4" fill="#222"/><text x="126" y="306" text-anchor="end" font-size="18" font-weight="700" fill="#222">A</text><circle cx="228.7" cy="109.7" r="4" fill="#222"/><text x="242.7" y="101.7" text-anchor="start" font-size="18" font-weight="700" fill="#222">B</text><text x="20" y="350" text-anchor="start" font-size="15" font-weight="400" fill="#222">Bearing of B from A: 025°.  Bearing of A from B: 025° + 180° = 205°.</text>
</svg>
