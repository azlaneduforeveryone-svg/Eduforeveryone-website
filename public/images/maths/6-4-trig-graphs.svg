<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 570" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Graphs of y = sin x, y = cos x and y = tan x from 0 to 360 degrees</title>
<desc id="d">Top: the sine wave starts at 0, rises to 1 at 90 degrees, falls to minus 1 at 270 degrees and returns to 0 at 360. Middle: the cosine wave starts at 1, falls to minus 1 at 180 degrees and returns to 1 at 360. Bottom: the tangent graph passes through 0 at 0, 180 and 360 degrees and has vertical asymptotes at 90 and 270 degrees.</desc>
