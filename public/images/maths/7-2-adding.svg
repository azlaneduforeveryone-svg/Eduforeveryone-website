<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Adding two vectors</title>
<desc id="d">Vector a, 2 across and 3 up, is followed by vector b, 4 across and 1 down. The resultant a plus b goes straight from the start to the end: 6 across and 2 up.</desc>
<rect x="0" width="360" height="240" fill="#ffffff"/>
<line x1="40.0" y1="200.0" x2="40.0" y2="40.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/><line x1="80.0" y1="200.0" x2="80.0" y2="40.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/><line x1="120.0" y1="200.0" x2="120.0" y2="40.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/><line x1="160.0" y1="200.0" x2="160.0" y2="40.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/><line x1="200.0" y1="200.0" x2="200.0" y2="40.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/><line x1="240.0" y1="200.0" x2="240.0" y2="40.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/><line x1="280.0" y1="200.0" x2="280.0" y2="40.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/><line x1="320.0" y1="200.0" x2="320.0" y2="40.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/><line x1="40.0" y1="200.0" x2="320.0" y2="200.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/><line x1="40.0" y1="160.0" x2="320.0" y2="160.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/><line x1="40.0" y1="120.0" x2="320.0" y2="120.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/><line x1="40.0" y1="80.0" x2="320.0" y2="80.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/><line x1="40.0" y1="40.0" x2="320.0" y2="40.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/><line x1="40.0" y1="200.0" x2="40.0" y2="40.0" stroke="#222" stroke-width="1.6" stroke-linecap="round"/><line x1="40.0" y1="200.0" x2="320.0" y2="200.0" stroke="#222" stroke-width="1.6" stroke-linecap="round"/><defs><marker id="ah0d9488" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0d9488"/></marker></defs><line x1="40" y1="200" x2="120" y2="80" stroke="#0d9488" stroke-width="3.5" marker-end="url(#ah0d9488)"/><defs><marker id="ahb7791f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b7791f"/></marker></defs><line x1="120" y1="80" x2="280" y2="120" stroke="#b7791f" stroke-width="3.5" marker-end="url(#ahb7791f)"/><defs><marker id="ahc0392b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs><line x1="40" y1="200" x2="280" y2="120" stroke="#c0392b" stroke-width="3.5" marker-end="url(#ahc0392b)"/><text x="70.0" y="116.0" text-anchor="end" font-size="15" font-weight="700" fill="#0d9488">a = (2, 3)</text><text x="206.0" y="90.0" text-anchor="start" font-size="15" font-weight="700" fill="#b7791f">b = (4, -1)</text><text x="190.0" y="184.0" text-anchor="middle" font-size="15" font-weight="700" fill="#c0392b">a + b = (6, 2)</text>
</svg>
