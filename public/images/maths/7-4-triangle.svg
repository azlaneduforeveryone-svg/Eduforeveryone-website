<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Triangle OAB with midpoint M of AB</title>
<desc id="d">Vectors a from O to A and b from O to B. M is the midpoint of AB, shown with equal tick marks. A dashed line goes from O to M.</desc>
<rect x="0" width="500" height="360" fill="#ffffff"/>
<polygon points="60.0,300.0 180.0,70.0 440.0,260.0" fill="#0d9488" fill-opacity="0.06" stroke="#0d9488" stroke-width="0" stroke-linejoin="round"/><defs><marker id="ah0d9488" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0d9488"/></marker></defs><line x1="60" y1="300" x2="180" y2="70" stroke="#0d9488" stroke-width="3" marker-end="url(#ah0d9488)"/><defs><marker id="ahb7791f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b7791f"/></marker></defs><line x1="60" y1="300" x2="440" y2="260" stroke="#b7791f" stroke-width="3" marker-end="url(#ahb7791f)"/><line x1="180.0" y1="70.0" x2="440.0" y2="260.0" stroke="#222" stroke-width="2" stroke-linecap="round"/><line x1="60.0" y1="300.0" x2="310.0" y2="165.0" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 5"/><circle cx="310.0" cy="165.0" r="5" fill="#c0392b"/><line x1="249.1" y1="111.8" x2="240.9" y2="123.2" stroke="#222" stroke-width="1.8" stroke-linecap="round"/><line x1="379.1" y1="206.8" x2="370.9" y2="218.2" stroke="#222" stroke-width="1.8" stroke-linecap="round"/><text x="50" y="318" text-anchor="middle" font-size="18" font-weight="700" fill="#222">O</text><text x="180" y="58" text-anchor="middle" font-size="18" font-weight="700" fill="#222">A</text><text x="454" y="266" text-anchor="start" font-size="18" font-weight="700" fill="#222">B</text><text x="322.0" y="155.0" text-anchor="start" font-size="18" font-weight="700" fill="#c0392b">M</text><text x="108.0" y="185.0" text-anchor="end" font-size="20" font-weight="700" fill="#0d9488">a</text><text x="260.0" y="304.0" text-anchor="middle" font-size="20" font-weight="700" fill="#b7791f">b</text><text x="250" y="345" text-anchor="middle" font-size="16" font-weight="700" fill="#222">AB = b - a,   OM = ½(a + b)</text>
</svg>
