<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Constructing a triangle with sides 7 cm, 5 cm and 6 cm</title>
<desc id="d">Side AB of 7 cm is drawn first. An arc of radius 5 cm is drawn from A and an arc of radius 6 cm from B. They cross at C, which is joined to A and B. The arcs are left showing.</desc>
<rect x="0" width="440" height="340" fill="#ffffff"/>
<line x1="80.0" y1="300.0" x2="360.0" y2="300.0" stroke="#222" stroke-width="3" stroke-linecap="round"/><line x1="80.0" y1="300.0" x2="188.6" y2="132.0" stroke="#222" stroke-width="3" stroke-linecap="round"/><line x1="360.0" y1="300.0" x2="188.6" y2="132.0" stroke="#222" stroke-width="3" stroke-linecap="round"/><path d="M226.8,164.1 A200,200 0 0 0 143.6,110.4" fill="none" stroke="#0d9488" stroke-width="2" stroke-dasharray="6 4"/><path d="M229.4,98.7 A240,240 0 0 0 156.0,173.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-dasharray="6 4"/><circle cx="80.0" cy="300.0" r="4" fill="#222"/><text x="66" y="308" text-anchor="middle" font-size="18" font-weight="700" fill="#222">A</text><circle cx="360.0" cy="300.0" r="4" fill="#222"/><text x="374" y="308" text-anchor="middle" font-size="18" font-weight="700" fill="#222">B</text><circle cx="188.6" cy="132.0" r="4" fill="#222"/><text x="188.6" y="118.0" text-anchor="middle" font-size="18" font-weight="700" fill="#222">C</text><text x="220.0" y="328" text-anchor="middle" font-size="16" font-weight="400" fill="#222">7 cm</text><text x="112.3" y="216.0" text-anchor="end" font-size="16" font-weight="700" fill="#0d9488">5 cm</text><text x="296.3" y="216.0" text-anchor="start" font-size="16" font-weight="700" fill="#b7791f">6 cm</text><text x="70" y="77.0" text-anchor="start" font-size="14" font-weight="400" fill="#0d9488">arc radius 5 cm from A</text><text x="370" y="102.0" text-anchor="end" font-size="14" font-weight="400" fill="#b7791f">arc radius 6 cm from B</text>
</svg>
