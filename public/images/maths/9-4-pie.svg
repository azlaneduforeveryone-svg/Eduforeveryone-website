<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Pie chart of favourite fruit</title>
<desc id="d">A pie chart for 60 students. Apple 120 degrees, banana 90 degrees, orange 60 degrees and mango 90 degrees.</desc>
<rect x="0" width="360" height="320" fill="#ffffff"/>
<path d="M180,170 L180.0,40.0 A130,130 0 0 1 292.6,235.0 Z" fill="#0d9488" fill-opacity="0.45" stroke="#ffffff" stroke-width="2"/><text x="247.5" y="129.0" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Apple</text><text x="247.5" y="147.0" text-anchor="middle" font-size="13" font-weight="400" fill="#222">120°</text><path d="M180,170 L292.6,235.0 A130,130 0 0 1 115.0,282.6 Z" fill="#b7791f" fill-opacity="0.45" stroke="#ffffff" stroke-width="2"/><text x="200.2" y="243.3" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Banana</text><text x="200.2" y="261.3" text-anchor="middle" font-size="13" font-weight="400" fill="#222">90°</text><path d="M180,170 L115.0,282.6 A130,130 0 0 1 50.0,170.0 Z" fill="#c0392b" fill-opacity="0.45" stroke="#ffffff" stroke-width="2"/><text x="112.5" y="207.0" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Orange</text><text x="112.5" y="225.0" text-anchor="middle" font-size="13" font-weight="400" fill="#222">60°</text><path d="M180,170 L50.0,170.0 A130,130 0 0 1 180.0,40.0 Z" fill="#6d28d9" fill-opacity="0.45" stroke="#ffffff" stroke-width="2"/><text x="124.8" y="112.8" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Mango</text><text x="124.8" y="130.8" text-anchor="middle" font-size="13" font-weight="400" fill="#222">90°</text><circle cx="180.0" cy="170.0" r="130.0" fill="none" fill-opacity="1" stroke="#222" stroke-width="1.5"/>
</svg>
