<title id="t">The two special triangles for exact values</title>
<desc id="d">Left: half of an equilateral triangle of side 2, with angles 30, 60 and 90 degrees and sides 1, root 3 and 2. Right: a right-angled isosceles triangle with sides 1, 1 and root 2 and angles 45, 45 and 90 degrees.</desc>
