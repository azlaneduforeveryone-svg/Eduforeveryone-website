<polygon points="60.0,270.0 160.0,270.0 160.0,96.8" fill="none" fill-opacity="1" stroke="#9ca3af" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 4"/><polygon points="160.0,270.0 260.0,270.0 160.0,96.8" fill="#0d9488" fill-opacity="0.1" stroke="#0d9488" stroke-width="3" stroke-linejoin="round"/><polyline points="172.0,270.0 172.0,258.0 160.0,258.0" fill="none" fill-opacity="1" stroke="#222" stroke-width="1.8" stroke-linejoin="round"/><text x="215" y="175" text-anchor="start" font-size="18" font-weight="700" fill="#222">2</text><text x="210" y="292" text-anchor="middle" font-size="18" font-weight="700" fill="#222">1</text><text x="150" y="195" text-anchor="end" font-size="18" font-weight="700" fill="#222">√3</text><path d="M177.0,126.2 A34,34 0 0 1 160.0,130.8" fill="none" stroke="#c0392b" stroke-width="2"/><text x="174.0" y="154.0" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b">30°</text><path d="M230.0,270.0 A30,30 0 0 1 245.0,244.0" fill="none" stroke="#c0392b" stroke-width="2"/><text x="215.0" y="249.0" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b">60°</text><text x="160" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Half an equilateral triangle</text><polygon points="360.0,270.0 520.0,270.0 360.0,110.0" fill="#b7791f" fill-opacity="0.12" stroke="#b7791f" stroke-width="3" stroke-linejoin="round"/><polyline points="372.0,270.0 372.0,258.0 360.0,258.0" fill="none" fill-opacity="1" stroke="#222" stroke-width="1.8" stroke-linejoin="round"/><text x="440" y="292" text-anchor="middle" font-size="18" font-weight="700" fill="#222">1</text><text x="348" y="195" text-anchor="end" font-size="18" font-weight="700" fill="#222">1</text><text x="450" y="180" text-anchor="start" font-size="18" font-weight="700" fill="#222">√2</text><path d="M488.0,270.0 A32,32 0 0 1 497.4,247.4" fill="none" stroke="#c0392b" stroke-width="2"/><text x="470.1" y="254.3" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b">45°</text><path d="M382.6,132.6 A32,32 0 0 1 360.0,142.0" fill="none" stroke="#c0392b" stroke-width="2"/><text x="380.7" y="164.9" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b">45°</text><text x="440" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Half a square</text>
</svg>
