<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Factor tree for 72</title>
<desc id="d">72 splits into 8 and 9. 8 splits into 2 and 4, and 4 into 2 and 2. 9 splits into 3 and 3. So 72 = 2 cubed times 3 squared.</desc>
<rect x="0" width="600" height="440" fill="#ffffff"/>
<line x1="300" y1="76" x2="200" y2="114" stroke="#555" stroke-width="2"/><line x1="300" y1="76" x2="400" y2="114" stroke="#555" stroke-width="2"/><line x1="200" y1="166" x2="140" y2="204" stroke="#555" stroke-width="2"/><line x1="200" y1="166" x2="260" y2="204" stroke="#555" stroke-width="2"/><line x1="400" y1="166" x2="350" y2="204" stroke="#555" stroke-width="2"/><line x1="400" y1="166" x2="450" y2="204" stroke="#555" stroke-width="2"/><line x1="260" y1="256" x2="210" y2="294" stroke="#555" stroke-width="2"/><line x1="260" y1="256" x2="310" y2="294" stroke="#555" stroke-width="2"/><circle cx="300" cy="50" r="26" fill="#ffffff" stroke="#555" stroke-width="2"/><text x="300" y="57" text-anchor="middle" font-size="20" font-weight="400" fill="#1a1a1a">72</text><circle cx="200" cy="140" r="26" fill="#ffffff" stroke="#555" stroke-width="2"/><text x="200" y="147" text-anchor="middle" font-size="20" font-weight="400" fill="#1a1a1a">8</text><circle cx="400" cy="140" r="26" fill="#ffffff" stroke="#555" stroke-width="2"/><text x="400" y="147" text-anchor="middle" font-size="20" font-weight="400" fill="#1a1a1a">9</text><circle cx="140" cy="230" r="26" fill="#e0f4f1" stroke="#0d9488" stroke-width="2"/><text x="140" y="237" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">2</text><circle cx="260" cy="230" r="26" fill="#ffffff" stroke="#555" stroke-width="2"/><text x="260" y="237" text-anchor="middle" font-size="20" font-weight="400" fill="#1a1a1a">4</text><circle cx="350" cy="230" r="26" fill="#e0f4f1" stroke="#0d9488" stroke-width="2"/><text x="350" y="237" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">3</text><circle cx="450" cy="230" r="26" fill="#e0f4f1" stroke="#0d9488" stroke-width="2"/><text x="450" y="237" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">3</text><circle cx="210" cy="320" r="26" fill="#e0f4f1" stroke="#0d9488" stroke-width="2"/><text x="210" y="327" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">2</text><circle cx="310" cy="320" r="26" fill="#e0f4f1" stroke="#0d9488" stroke-width="2"/><text x="310" y="327" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">2</text><text x="300" y="390" text-anchor="middle" font-size="18" font-weight="400" fill="#1a1a1a">Primes (shaded): 2, 2, 2, 3, 3</text><text x="300" y="418" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">72 = 2³ × 3²</text>
