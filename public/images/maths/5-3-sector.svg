<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Minor sector, major sector and arc of a circle</title>
<desc id="d">A circle with a shaded minor sector of angle theta at the centre. The curved edge of the sector is the arc. The rest of the circle is the major sector.</desc>
<rect x="0" width="560" height="380" fill="#ffffff"/>
<circle cx="200.0" cy="200.0" r="150.0" fill="#0d9488" fill-opacity="0.05" stroke="#0d9488" stroke-width="2.5"/><path d="M200,200 L335.9,136.6 A150,150 0 0 0 186.9,50.6 Z" fill="#b7791f" fill-opacity="0.3" stroke="#222" stroke-width="2.5"/><path d="M335.9,136.6 A150,150 0 0 0 186.9,50.6" fill="none" stroke="#c0392b" stroke-width="5"/><path d="M197.4,170.1 A30,30 0 0 1 227.2,187.3" fill="none" stroke="#222" stroke-width="2"/><text x="224.0" y="163.4" text-anchor="middle" font-size="15" font-weight="700" fill="#222">θ</text><circle cx="200.0" cy="200.0" r="4" fill="#222"/><text x="215" y="222" text-anchor="start" font-size="14" font-weight="400" fill="#222">centre</text><text x="265.5" y="113.7" text-anchor="middle" font-size="15" font-weight="700" fill="#222">minor</text><text x="265.5" y="131.7" text-anchor="middle" font-size="15" font-weight="700" fill="#222">sector</text><text x="180" y="295" text-anchor="middle" font-size="16" font-weight="700" fill="#0d9488">major sector</text><text x="290.7" y="48.1" text-anchor="start" font-size="16" font-weight="700" fill="#c0392b">arc</text><text x="276.0" y="190.3" text-anchor="middle" font-size="17" font-weight="700" fill="#222">r</text><text x="400" y="120" text-anchor="start" font-size="15" font-weight="700" fill="#222">Sector area</text><text x="400" y="140" text-anchor="start" font-size="15" font-weight="400" fill="#222">= θ/360 × πr²</text><text x="400" y="190" text-anchor="start" font-size="15" font-weight="700" fill="#c0392b">Arc length</text><text x="400" y="210" text-anchor="start" font-size="15" font-weight="400" fill="#c0392b">= θ/360 × 2πr</text>
</svg>
