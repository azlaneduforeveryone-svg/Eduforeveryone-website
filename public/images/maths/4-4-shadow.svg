<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">A stick and a tree with their shadows</title>
<desc id="d">A 1.5 metre stick casts a 2 metre shadow. A tree casts a 12 metre shadow. The sun&#x27;s rays make two similar right-angled triangles.</desc>
<rect x="0" width="640" height="300" fill="#ffffff"/>
<line x1="20.0" y1="270.0" x2="620.0" y2="270.0" stroke="#222" stroke-width="2" stroke-linecap="round"/><line x1="60.0" y1="270.0" x2="60.0" y2="237.0" stroke="#0d9488" stroke-width="4" stroke-linecap="round"/><line x1="60.0" y1="237.0" x2="120.0" y2="270.0" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="60.0" y1="270.0" x2="120.0" y2="270.0" stroke="#b7791f" stroke-width="5" stroke-linecap="round"/><text x="52" y="250" text-anchor="end" font-size="14" font-weight="700" fill="#0d9488">1.5 m</text><text x="90" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#b7791f">2 m</text><line x1="230.0" y1="270.0" x2="230.0" y2="70.0" stroke="#0d9488" stroke-width="6" stroke-linecap="round"/><circle cx="230.0" cy="55.0" r="30.0" fill="#0d9488" fill-opacity="0.25" stroke="#0d9488" stroke-width="2"/><line x1="230.0" y1="70.0" x2="590.0" y2="270.0" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="230.0" y1="270.0" x2="590.0" y2="270.0" stroke="#b7791f" stroke-width="5" stroke-linecap="round"/><text x="220" y="150" text-anchor="end" font-size="15" font-weight="700" fill="#0d9488">tree ?</text><text x="410" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#b7791f">12 m</text><text x="560" y="150" text-anchor="start" font-size="14" font-weight="400" fill="#666">sun's rays</text>
</svg>
