<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Venn diagram: cricket and football</title>
<desc id="d">13 play cricket only, 5 play both, 7 play football only and 5 play neither. Total 30.</desc>
<rect x="0" width="600" height="400" fill="#ffffff"/>
<rect x="20" y="40" width="560" height="320" fill="none" stroke="#333" stroke-width="2"/><text x="40" y="32" text-anchor="start" font-size="18" font-weight="400" fill="#1a1a1a">ℰ = 30 students</text><circle cx="235" cy="200" r="120" fill="#0d9488" fill-opacity="0.12" stroke="#0d9488" stroke-width="2.5"/><circle cx="365" cy="200" r="120" fill="#b7791f" fill-opacity="0.12" stroke="#b7791f" stroke-width="2.5"/><text x="175" y="68" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Cricket (C)</text><text x="425" y="68" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Football (F)</text><text x="175" y="210" text-anchor="middle" font-size="28" font-weight="700" fill="#1a1a1a">13</text><text x="300" y="210" text-anchor="middle" font-size="28" font-weight="700" fill="#1a1a1a">5</text><text x="425" y="210" text-anchor="middle" font-size="28" font-weight="700" fill="#1a1a1a">7</text><text x="545" y="340" text-anchor="middle" font-size="28" font-weight="700" fill="#1a1a1a">5</text><text x="300" y="388" text-anchor="middle" font-size="16" font-weight="400" fill="#1a1a1a">Both (C ∩ F) = 5. Neither = 5.</text>
</svg>
