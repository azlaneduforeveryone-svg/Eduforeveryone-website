<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 505" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Squares on the sides of a 3, 4, 5 right-angled triangle</title>
<desc id="d">A right-angled triangle with sides 3, 4 and 5. Squares on the two shorter sides have areas 9 and 16. The square on the hypotenuse has area 25, which is 9 plus 16.</desc>
<rect x="0" width="540" height="505" fill="#ffffff"/>
<polygon points="200.0,320.0 360.0,320.0 360.0,480.0 200.0,480.0" fill="#b7791f" fill-opacity="0.15" stroke="#b7791f" stroke-width="2" stroke-linejoin="round"/><polygon points="200.0,320.0 200.0,200.0 80.0,200.0 80.0,320.0" fill="#6d28d9" fill-opacity="0.15" stroke="#6d28d9" stroke-width="2" stroke-linejoin="round"/><polygon points="200.0,200.0 360.0,320.0 480.0,160.0 320.0,40.0" fill="#0d9488" fill-opacity="0.15" stroke="#0d9488" stroke-width="2" stroke-linejoin="round"/><polygon points="200.0,320.0 200.0,200.0 360.0,320.0" fill="#ffffff" fill-opacity="1" stroke="#222" stroke-width="3" stroke-linejoin="round"/><polyline points="214.0,320.0 214.0,306.0 200.0,306.0" fill="none" fill-opacity="1" stroke="#222" stroke-width="1.8" stroke-linejoin="round"/><text x="140.0" y="266.0" text-anchor="middle" font-size="18" font-weight="700" fill="#6d28d9">3² = 9</text><text x="280" y="408" text-anchor="middle" font-size="20" font-weight="700" fill="#b7791f">4² = 16</text><text x="340.0" y="188.0" text-anchor="middle" font-size="22" font-weight="700" fill="#0d9488">5² = 25</text><text x="210" y="266.0" text-anchor="start" font-size="16" font-weight="700" fill="#222">a</text><text x="280.0" y="312" text-anchor="middle" font-size="16" font-weight="700" fill="#222">b</text><text x="268.0" y="282.0" text-anchor="middle" font-size="16" font-weight="700" fill="#222">c</text><text x="270" y="492" text-anchor="middle" font-size="17" font-weight="700" fill="#222">9 + 16 = 25, so a² + b² = c²</text>
</svg>
