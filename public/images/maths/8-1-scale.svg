<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 170" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">The probability scale</title>
<desc id="d">A line from 0 to 1. 0 means impossible, a quarter is unlikely, a half is an even chance, three quarters is likely and 1 is certain. Examples: rolling a 7 on a dice is 0, a coin landing heads is a half, the sun rising is 1.</desc>
<rect x="0" width="700" height="170" fill="#ffffff"/>
<line x1="50.0" y1="90.0" x2="650.0" y2="90.0" stroke="#222" stroke-width="3" stroke-linecap="round"/><line x1="50.0" y1="78.0" x2="50.0" y2="102.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><text x="50" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#222">0</text><text x="50" y="126" text-anchor="middle" font-size="15" font-weight="400" fill="#222">impossible</text><line x1="200.0" y1="78.0" x2="200.0" y2="102.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><text x="200.0" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#222">1/4</text><text x="200.0" y="126" text-anchor="middle" font-size="15" font-weight="400" fill="#222">unlikely</text><line x1="350.0" y1="78.0" x2="350.0" y2="102.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><text x="350.0" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#222">1/2</text><text x="350.0" y="126" text-anchor="middle" font-size="15" font-weight="400" fill="#222">even chance</text><line x1="500.0" y1="78.0" x2="500.0" y2="102.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><text x="500.0" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#222">3/4</text><text x="500.0" y="126" text-anchor="middle" font-size="15" font-weight="400" fill="#222">likely</text><line x1="650.0" y1="78.0" x2="650.0" y2="102.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><text x="650" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#222">1</text><text x="650" y="126" text-anchor="middle" font-size="15" font-weight="400" fill="#222">certain</text><text x="50.0" y="152" text-anchor="middle" font-size="13" font-weight="400" fill="#0d9488">rolling a 7</text><text x="350.0" y="152" text-anchor="middle" font-size="13" font-weight="400" fill="#0d9488">a coin lands heads</text><text x="650.0" y="152" text-anchor="middle" font-size="13" font-weight="400" fill="#0d9488">the sun rises</text>
</svg>
