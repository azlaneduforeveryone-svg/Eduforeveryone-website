<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 255" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Acute, right, obtuse and reflex angles</title>
<desc id="d">Four angles: acute (less than 90 degrees), a right angle (exactly 90 degrees, marked with a small square), obtuse (between 90 and 180 degrees) and reflex (more than 180 degrees).</desc>
<rect x="0" width="740" height="255" fill="#ffffff"/>
<line x1="30.0" y1="160.0" x2="125.0" y2="160.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><line x1="30.0" y1="160.0" x2="91.1" y2="87.2" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><path d="M48.0,138.6 A28,28 0 0 1 58.0,160.0" fill="none" stroke="#c0392b" stroke-width="2.4"/><text x="85" y="215" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Acute</text><text x="85" y="238" text-anchor="middle" font-size="14" font-weight="400" fill="#555">less than 90°</text><line x1="205.0" y1="160.0" x2="300.0" y2="160.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><line x1="205.0" y1="160.0" x2="205.0" y2="65.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><polyline points="223.0,160.0 223.0,142.0 205.0,142.0" fill="none" fill-opacity="1" stroke="#c0392b" stroke-width="1.8" stroke-linejoin="round"/><text x="260" y="215" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Right angle</text><text x="260" y="238" text-anchor="middle" font-size="14" font-weight="400" fill="#555">exactly 90°</text><line x1="450.0" y1="160.0" x2="545.0" y2="160.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><line x1="450.0" y1="160.0" x2="388.9" y2="87.2" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><path d="M432.0,138.6 A28,28 0 0 1 478.0,160.0" fill="none" stroke="#c0392b" stroke-width="2.4"/><text x="430" y="215" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Obtuse</text><text x="430" y="238" text-anchor="middle" font-size="14" font-weight="400" fill="#555">between 90° and 180°</text><line x1="650.0" y1="110.0" x2="725.0" y2="110.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><line x1="650.0" y1="110.0" x2="601.8" y2="167.5" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><path d="M635.9,126.9 A22,22 0 1 1 672.0,110.0" fill="none" stroke="#c0392b" stroke-width="2.4"/><text x="640" y="215" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Reflex</text><text x="640" y="238" text-anchor="middle" font-size="14" font-weight="400" fill="#555">more than 180°</text>
</svg>
