<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Relative frequency of heads as the number of throws increases</title>
<desc id="d">A graph of the relative frequency of heads against the number of coin throws, from 10 to 1000. It starts at 0.7 after 10 throws, moves up and down, and settles close to the true probability of 0.5 after many throws.</desc>
<rect x="0" width="680" height="320" fill="#ffffff"/>
<line x1="80.0" y1="260.0" x2="650.0" y2="260.0" stroke="#222" stroke-width="1.6" stroke-linecap="round"/><line x1="80.0" y1="260.0" x2="80.0" y2="30.0" stroke="#222" stroke-width="1.6" stroke-linecap="round"/><line x1="75.0" y1="260.0" x2="80.0" y2="260.0" stroke="#222" stroke-width="1.5" stroke-linecap="round"/><text x="71" y="265" text-anchor="end" font-size="13" font-weight="400" fill="#222">0</text><line x1="75.0" y1="205.0" x2="80.0" y2="205.0" stroke="#222" stroke-width="1.5" stroke-linecap="round"/><text x="71" y="210.0" text-anchor="end" font-size="13" font-weight="400" fill="#222">0.25</text><line x1="75.0" y1="150.0" x2="80.0" y2="150.0" stroke="#222" stroke-width="1.5" stroke-linecap="round"/><text x="71" y="155.0" text-anchor="end" font-size="13" font-weight="400" fill="#222">0.5</text><line x1="75.0" y1="95.0" x2="80.0" y2="95.0" stroke="#222" stroke-width="1.5" stroke-linecap="round"/><text x="71" y="100.0" text-anchor="end" font-size="13" font-weight="400" fill="#222">0.75</text><line x1="75.0" y1="40.0" x2="80.0" y2="40.0" stroke="#222" stroke-width="1.5" stroke-linecap="round"/><text x="71" y="45" text-anchor="end" font-size="13" font-weight="400" fill="#222">1</text><line x1="80.0" y1="260.0" x2="80.0" y2="265.0" stroke="#222" stroke-width="1.5" stroke-linecap="round"/><text x="80.0" y="280" text-anchor="middle" font-size="13" font-weight="400" fill="#222">10</text><line x1="164.3" y1="260.0" x2="164.3" y2="265.0" stroke="#222" stroke-width="1.5" stroke-linecap="round"/><text x="164.3" y="280" text-anchor="middle" font-size="13" font-weight="400" fill="#222">20</text><line x1="275.7" y1="260.0" x2="275.7" y2="265.0" stroke="#222" stroke-width="1.5" stroke-linecap="round"/><text x="275.7" y="280" text-anchor="middle" font-size="13" font-weight="400" fill="#222">50</text><line x1="360.0" y1="260.0" x2="360.0" y2="265.0" stroke="#222" stroke-width="1.5" stroke-linecap="round"/><text x="360.0" y="280" text-anchor="middle" font-size="13" font-weight="400" fill="#222">100</text><line x1="444.3" y1="260.0" x2="444.3" y2="265.0" stroke="#222" stroke-width="1.5" stroke-linecap="round"/><text x="444.3" y="280" text-anchor="middle" font-size="13" font-weight="400" fill="#222">200</text><line x1="555.7" y1="260.0" x2="555.7" y2="265.0" stroke="#222" stroke-width="1.5" stroke-linecap="round"/><text x="555.7" y="280" text-anchor="middle" font-size="13" font-weight="400" fill="#222">500</text><line x1="640.0" y1="260.0" x2="640.0" y2="265.0" stroke="#222" stroke-width="1.5" stroke-linecap="round"/><text x="640.0" y="280" text-anchor="middle" font-size="13" font-weight="400" fill="#222">1000</text><line x1="80.0" y1="150.0" x2="640.0" y2="150.0" stroke="#c0392b" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="7 5"/><text x="640" y="142.0" text-anchor="end" font-size="13" font-weight="700" fill="#c0392b">true probability 0.5</text><polyline points="80.0,106.0 164.3,128.0 275.7,136.8 360.0,156.6 444.3,146.7 555.7,151.3 640.0,149.6" fill="none" fill-opacity="1" stroke="#0d9488" stroke-width="2.5" stroke-linejoin="round"/><circle cx="80.0" cy="106.0" r="4.5" fill="#0d9488"/><circle cx="164.3" cy="128.0" r="4.5" fill="#0d9488"/><circle cx="275.7" cy="136.8" r="4.5" fill="#0d9488"/><circle cx="360.0" cy="156.6" r="4.5" fill="#0d9488"/><circle cx="444.3" cy="146.7" r="4.5" fill="#0d9488"/><circle cx="555.7" cy="151.3" r="4.5" fill="#0d9488"/><circle cx="640.0" cy="149.6" r="4.5" fill="#0d9488"/><text x="360.0" y="305" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Number of throws</text><text x="24" y="150.0" text-anchor="middle" font-size="14" font-weight="700" fill="#222" transform="rotate(-90 24 150.0)">Relative frequency of heads</text>
</svg>
