<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 310" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Labelling a right-angled triangle for angle x</title>
<desc id="d">A right-angled triangle. The longest side, opposite the right angle, is the hypotenuse. The side opposite angle x is the opposite. The side next to angle x is the adjacent.</desc>
<rect x="0" width="730" height="310" fill="#ffffff"/>
<polygon points="60.0,260.0 400.0,260.0 400.0,60.0" fill="#0d9488" fill-opacity="0.07" stroke="#0d9488" stroke-width="3" stroke-linejoin="round"/><polyline points="384.0,260.0 384.0,244.0 400.0,244.0" fill="none" fill-opacity="1" stroke="#222" stroke-width="1.8" stroke-linejoin="round"/><path d="M98.8,237.2 A45,45 0 0 1 105.0,260.0" fill="none" stroke="#c0392b" stroke-width="2.5"/><text x="123.7" y="247.7" text-anchor="middle" font-size="18" font-weight="700" fill="#c0392b">x</text><text x="220" y="140" text-anchor="end" font-size="17" font-weight="700" fill="#0d9488">Hypotenuse (H)</text><text x="412" y="165" text-anchor="start" font-size="17" font-weight="700" fill="#6d28d9">Opposite (O)</text><text x="230" y="290" text-anchor="middle" font-size="17" font-weight="700" fill="#b7791f">Adjacent (A)</text><text x="640" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="#222">sin x = O/H</text><text x="640" y="155" text-anchor="middle" font-size="17" font-weight="700" fill="#222">cos x = A/H</text><text x="640" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#222">tan x = O/A</text>
</svg>
