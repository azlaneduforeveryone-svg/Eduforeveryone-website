<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Venn diagram for football and tennis</title>
<desc id="d">A rectangle for 30 students with two overlapping circles. Football only 13, both 5, tennis only 7, and 5 outside both circles.</desc>
<rect x="0" width="560" height="350" fill="#ffffff"/>
<polygon points="30.0,30.0 530.0,30.0 530.0,320.0 30.0,320.0" fill="none" fill-opacity="1" stroke="#222" stroke-width="2" stroke-linejoin="round"/><text x="45" y="55" text-anchor="start" font-size="15" font-weight="700" fill="#222">30 students</text><circle cx="210.0" cy="195.0" r="105.0" fill="#0d9488" fill-opacity="0.12" stroke="#0d9488" stroke-width="2.5"/><circle cx="350.0" cy="195.0" r="105.0" fill="#b7791f" fill-opacity="0.12" stroke="#b7791f" stroke-width="2.5"/><text x="150" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#0d9488">Football (18)</text><text x="420" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#b7791f">Tennis (12)</text><text x="165" y="205" text-anchor="middle" font-size="26" font-weight="700" fill="#222">13</text><text x="280" y="205" text-anchor="middle" font-size="26" font-weight="700" fill="#222">5</text><text x="395" y="205" text-anchor="middle" font-size="26" font-weight="700" fill="#222">7</text><text x="495" y="300" text-anchor="middle" font-size="26" font-weight="700" fill="#222">5</text><text x="478" y="276" text-anchor="end" font-size="13" font-weight="400" fill="#222">neither</text><text x="280" y="235" text-anchor="middle" font-size="13" font-weight="400" fill="#222">both</text>
</svg>
