<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Net of a cuboid 5 cm by 3 cm by 2 cm</title>
<desc id="d">A cross-shaped net of six rectangles: two of 5 by 3, two of 5 by 2 and two ends of 3 by 2.</desc>
<rect x="0" width="400" height="360" fill="#ffffff"/>
<rect x="140" y="30" width="150" height="60" fill="#0d9488" fill-opacity="0.1" stroke="#0d9488" stroke-width="2.5"/><text x="215.0" y="65.0" text-anchor="middle" font-size="14" font-weight="700" fill="#222">2 × 5</text><rect x="140" y="90" width="150" height="90" fill="#0d9488" fill-opacity="0.1" stroke="#0d9488" stroke-width="2.5"/><text x="215.0" y="140.0" text-anchor="middle" font-size="14" font-weight="700" fill="#222">top 5 × 3</text><rect x="140" y="180" width="150" height="60" fill="#0d9488" fill-opacity="0.1" stroke="#0d9488" stroke-width="2.5"/><text x="215.0" y="215.0" text-anchor="middle" font-size="14" font-weight="700" fill="#222">2 × 5</text><rect x="140" y="240" width="150" height="90" fill="#0d9488" fill-opacity="0.1" stroke="#0d9488" stroke-width="2.5"/><text x="215.0" y="290.0" text-anchor="middle" font-size="14" font-weight="700" fill="#222">bottom 5 × 3</text><rect x="80" y="90" width="60" height="90" fill="#0d9488" fill-opacity="0.1" stroke="#0d9488" stroke-width="2.5"/><text x="110.0" y="140.0" text-anchor="middle" font-size="14" font-weight="700" fill="#222">end</text><rect x="290" y="90" width="60" height="90" fill="#0d9488" fill-opacity="0.1" stroke="#0d9488" stroke-width="2.5"/><text x="320.0" y="140.0" text-anchor="middle" font-size="14" font-weight="700" fill="#222">end</text><text x="215.0" y="22" text-anchor="middle" font-size="14" font-weight="400" fill="#222">5 cm</text><text x="358" y="140.0" text-anchor="start" font-size="14" font-weight="400" fill="#222">3 cm</text><text x="320.0" y="82" text-anchor="middle" font-size="14" font-weight="400" fill="#222">2 cm</text>
</svg>
