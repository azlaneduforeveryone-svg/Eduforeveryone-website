<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 255" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">The angle at the centre, angles in the same segment, a cyclic quadrilateral and the alternate segment theorem</title>
<desc id="d">Four circles. One: the angle at the centre is 2x and the angle at the circumference on the same arc is x. Two: two angles at the circumference on the same chord are both x. Three: opposite angles of a cyclic quadrilateral are a and 180 minus a. Four: the angle between a tangent and a chord is x, equal to the angle in the alternate segment.</desc>
<rect x="0" width="890" height="255" fill="#ffffff"/>
