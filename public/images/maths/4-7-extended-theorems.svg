-size="14" font-weight="700" fill="#0d9488">x</text><path d="M299.7,60.0 A22,22 0 0 1 280.3,66.1" fill="none" stroke="#6d28d9" stroke-width="2"/><text x="294.9" y="83.8" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">x</text><text x="330" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Angles in the same</text><text x="330" y="243" text-anchor="middle" font-size="14" font-weight="700" fill="#222">segment are equal</text><circle cx="550.0" cy="110.0" r="80.0" fill="none" fill-opacity="1" stroke="#222" stroke-width="2.5"/><polygon points="536.1,31.2 625.2,82.6 577.4,185.2 474.8,137.4" fill="#0d9488" fill-opacity="0.06" stroke="#0d9488" stroke-width="2.5" stroke-linejoin="round"/><path d="M553.4,41.2 A20,20 0 0 1 526.1,48.5" fill="none" stroke="#c0392b" stroke-width="2"/><text x="544.9" y="69.1" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b">a</text><path d="M559.2,176.7 A20,20 0 0 1 585.8,167.0" fill="none" stroke="#c0392b" stroke-width="2"/><text x="562.3" y="148.8" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">180 &#8722; a</text><text x="550" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Cyclic quadrilateral: opposite</text><text x="550" y="243" text-anchor="middle" font-size="14" font-weight="700" fill="#222">angles add up to 180°</text><circle cx="770.0" cy="110.0" r="80.0" fill="none" fill-opacity="1" stroke="#222" stroke-width="2.5"/><line x1="670.0" y1="190.0" x2="870.0" y2="190.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><line x1="770.0" y1="190.0" x2="845.2" y2="82.6" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round"/><line x1="770.0" y1="190.0" x2="708.7" y2="58.6" stroke="#b7791f" stroke-width="2.5" stroke-linecap="round"/><line x1="845.2" y1="82.6" x2="708.7" y2="58.6" stroke="#b7791f" stroke-width="2.5" stroke-linecap="round"/><path d="M787.2,165.4 A30,30 0 0 1 800.0,190.0" fill="none" stroke="#c0392b" stroke-width="2"/><text x="810.8" y="173.8" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b">x</text><path d="M732.4,62.7 A24,24 0 0 1 718.9,80.3" fill="none" stroke="#c0392b" stroke-width="2"/><text x="740.5" y="87.9" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b">x</text><text x="770" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Alternate segment</text><text x="770" y="243" text-anchor="middle" font-size="14" font-weight="700" fill="#222">theorem</text>
