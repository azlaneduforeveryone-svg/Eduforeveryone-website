<title id="t">The same sales data drawn with a misleading axis and a fair axis</title>
<desc id="d">Two bar charts of sales of 94, 96 and 99 thousand in 2023, 2024 and 2025. On the left the vertical axis starts at 90, so the last bar looks more than twice as tall as the first. On the right the axis starts at 0 and the bars look almost the same.</desc>
