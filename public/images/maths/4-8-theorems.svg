<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 272" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Chord theorems and equal tangents</title>
<desc id="d">Left: a line from the centre O meets chord AB at M at a right angle, and AM equals MB. Middle: two equal chords are the same distance from the centre. Right: two tangents from an outside point P touch the circle at A and B, and PA equals PB.</desc>
<rect x="0" width="840" height="272" fill="#ffffff"/>
<circle cx="130.0" cy="125.0" r="85.0" fill="none" fill-opacity="1" stroke="#222" stroke-width="2.5"/><circle cx="130.0" cy="125.0" r="4" fill="#222"/><text x="120" y="119" text-anchor="end" font-size="14" font-weight="700" fill="#222">O</text><line x1="60.4" y1="173.8" x2="199.6" y2="173.8" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round"/><line x1="130.0" y1="125.0" x2="130.0" y2="173.8" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round"/><line x1="130.0" y1="125.0" x2="60.4" y2="173.8" stroke="#b7791f" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4"/><polyline points="130.0,162.8 141.0,162.8 141.0,173.8" fill="none" fill-opacity="1" stroke="#c0392b" stroke-width="1.8" stroke-linejoin="round"/><line x1="95.2" y1="166.8" x2="95.2" y2="180.8" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round"/><line x1="164.8" y1="166.8" x2="164.8" y2="180.8" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round"/><text x="54.4" y="187.8" text-anchor="end" font-size="14" font-weight="700" fill="#222">A</text><text x="205.6" y="187.8" text-anchor="start" font-size="14" font-weight="700" fill="#222">B</text><text x="130.0" y="193.8" text-anchor="middle" font-size="14" font-weight="700" fill="#222">M</text><text x="130" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Perpendicular from the</text><text x="130" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#222">centre bisects the chord</text><circle cx="380.0" cy="125.0" r="85.0" fill="none" fill-opacity="1" stroke="#222" stroke-width="2.5"/><circle cx="380.0" cy="125.0" r="4" fill="#222"/><line x1="300.1" y1="154.1" x2="409.1" y2="204.9" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round"/><line x1="380.0" y1="125.0" x2="354.6" y2="179.5" stroke="#c0392b" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><polyline points="358.8,170.4 367.9,174.6 363.7,183.7" fill="none" fill-opacity="1" stroke="#c0392b" stroke-width="1.8" stroke-linejoin="round"/><line x1="354.8" y1="171.9" x2="348.9" y2="184.5" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round"/><line x1="360.3" y1="174.4" x2="354.4" y2="187.1" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round"/><line x1="459.9" y1="154.1" x2="409.1" y2="45.1" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round"/><line x1="380.0" y1="125.0" x2="434.5" y2="99.6" stroke="#c0392b" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><polyline points="425.4,103.8 421.2,94.8 430.2,90.5" fill="none" fill-opacity="1" stroke="#c0392b" stroke-width="1.8" stroke-linejoin="round"/><line x1="429.4" y1="105.3" x2="442.1" y2="99.4" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round"/><line x1="426.9" y1="99.8" x2="439.5" y2="93.9" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round"/><text x="380" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Equal chords are the same</text><text x="380" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#222">distance from the centre</text><circle cx="610.0" cy="125.0" r="68.0" fill="none" fill-opacity="1" stroke="#222" stroke-width="2.5"/><circle cx="610.0" cy="125.0" r="4" fill="#222"/><line x1="810.0" y1="125.0" x2="633.1" y2="61.1" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round"/><line x1="810.0" y1="125.0" x2="633.1" y2="188.9" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round"/><line x1="610.0" y1="125.0" x2="633.1" y2="61.1" stroke="#b7791f" stroke-width="1.8" stroke-linecap="round"/><line x1="610.0" y1="125.0" x2="633.1" y2="188.9" stroke="#b7791f" stroke-width="1.8" stroke-linecap="round"/><polyline points="629.7,70.5 639.1,73.9 642.5,64.5" fill="none" fill-opacity="1" stroke="#c0392b" stroke-width="1.8" stroke-linejoin="round"/><polyline points="629.7,179.5 639.1,176.1 642.5,185.5" fill="none" fill-opacity="1" stroke="#c0392b" stroke-width="1.8" stroke-linejoin="round"/><line x1="723.9" y1="86.4" x2="719.2" y2="99.6" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round"/><line x1="719.2" y1="150.4" x2="723.9" y2="163.6" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round"/><circle cx="810.0" cy="125.0" r="4" fill="#222"/><text x="820" y="130" text-anchor="start" font-size="14" font-weight="700" fill="#222">P</text><text x="633.1" y="51.1" text-anchor="middle" font-size="14" font-weight="700" fill="#222">A</text><text x="633.1" y="210.9" text-anchor="middle" font-size="14" font-weight="700" fill="#222">B</text><text x="690" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Tangents from P</text><text x="690" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#222">are equal: PA = PB</text>
</svg>
