necap="round"/><line x1="109.0" y1="40.0" x2="121.0" y2="40.0" stroke="#222" stroke-width="1.5" stroke-linecap="round"/><line x1="109.0" y1="185.0" x2="121.0" y2="185.0" stroke="#222" stroke-width="1.5" stroke-linecap="round"/><text x="123" y="117.5" text-anchor="start" font-size="14" font-weight="700" fill="#222">12 cm</text><text x="340" y="80" text-anchor="start" font-size="14" font-weight="400" fill="#9ca3af">small cone</text><text x="340" y="98" text-anchor="start" font-size="14" font-weight="400" fill="#9ca3af">(cut off)</text><text x="280" y="375" text-anchor="middle" font-size="16" font-weight="700" fill="#0d9488">Frustum = big cone - small cone</text>
