<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">An L-shaped room and an arched window</title>
<desc id="d">Left: an L-shape inside a 10 m by 8 m rectangle, with a 4 m by 3 m corner missing. A dashed line splits it into a 6 by 3 part and a 10 by 5 part. Right: a window made of a 1.2 m by 1 m rectangle with a semicircle of diameter 1.2 m on top.</desc>
<rect x="0" width="760" height="350" fill="#ffffff"/>
<polygon points="210.0,50.0 310.0,50.0 310.0,125.0 210.0,125.0" fill="none" fill-opacity="1" stroke="#9ca3af" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="5 4"/><polygon points="60.0,50.0 210.0,50.0 210.0,125.0 310.0,125.0 310.0,250.0 60.0,250.0" fill="#0d9488" fill-opacity="0.1" stroke="#0d9488" stroke-width="2.5" stroke-linejoin="round"/><line x1="60.0" y1="125.0" x2="210.0" y2="125.0" stroke="#b7791f" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 4"/><text x="135" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#222">6 m</text><text x="185" y="272" text-anchor="middle" font-size="15" font-weight="700" fill="#222">10 m</text><text x="50" y="155" text-anchor="end" font-size="15" font-weight="700" fill="#222">8 m</text><text x="320" y="192.5" text-anchor="start" font-size="15" font-weight="700" fill="#222">5 m</text><text x="260" y="117" text-anchor="middle" font-size="15" font-weight="700" fill="#222">4 m</text><text x="202" y="92.5" text-anchor="end" font-size="15" font-weight="700" fill="#222">3 m</text><text x="260" y="92.5" text-anchor="middle" font-size="13" font-weight="400" fill="#9ca3af">missing</text><text x="135" y="92.5" text-anchor="middle" font-size="14" font-weight="400" fill="#b7791f">6 × 3</text><text x="185" y="192.5" text-anchor="middle" font-size="14" font-weight="400" fill="#b7791f">10 × 5</text><text x="185" y="335" text-anchor="middle" font-size="16" font-weight="700" fill="#222">L-shaped room</text><polygon points="470.0,140.0 650.0,140.0 650.0,290.0 470.0,290.0" fill="#0d9488" fill-opacity="0.1" stroke="#0d9488" stroke-width="2.5" stroke-linejoin="round"/><path d="M470,140 A90.0,90.0 0 0 1 650.0,140 Z" fill="#b7791f" fill-opacity="0.25" stroke="#0d9488" stroke-width="2.5"/><line x1="470.0" y1="140.0" x2="650.0" y2="140.0" stroke="#b7791f" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 4"/><text x="560.0" y="312" text-anchor="middle" font-size="15" font-weight="700" fill="#222">1.2 m</text><text x="660.0" y="220.0" text-anchor="start" font-size="15" font-weight="700" fill="#222">1 m</text><text x="560.0" y="110" text-anchor="middle" font-size="14" font-weight="400" fill="#b7791f">semicircle</text><text x="560.0" y="335" text-anchor="middle" font-size="16" font-weight="700" fill="#222">Arched window</text>
</svg>
