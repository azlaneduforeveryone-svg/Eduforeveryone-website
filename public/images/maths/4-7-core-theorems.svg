<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">The angle in a semicircle and the tangent and radius</title>
<desc id="d">Left: AB is a diameter and C is on the circle; angle ACB is a right angle. Right: a tangent touches the circle at T; the radius OT meets the tangent at a right angle.</desc>
<rect x="0" width="600" height="300" fill="#ffffff"/>
<circle cx="150.0" cy="150.0" r="100.0" fill="none" fill-opacity="1" stroke="#222" stroke-width="2.5"/><circle cx="150.0" cy="150.0" r="4" fill="#222"/><text x="150" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="#222">O</text><line x1="50.0" y1="150.0" x2="250.0" y2="150.0" stroke="#6d28d9" stroke-width="2.5" stroke-linecap="round"/><line x1="50.0" y1="150.0" x2="107.7" y2="59.4" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round"/><line x1="250.0" y1="150.0" x2="107.7" y2="59.4" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round"/><polyline points="100.8,70.3 111.7,77.3 118.7,66.4" fill="none" fill-opacity="1" stroke="#c0392b" stroke-width="1.8" stroke-linejoin="round"/><text x="40.0" y="155.0" text-anchor="end" font-size="16" font-weight="700" fill="#222">A</text><text x="260.0" y="155.0" text-anchor="start" font-size="16" font-weight="700" fill="#222">B</text><text x="103.7" y="49.4" text-anchor="middle" font-size="16" font-weight="700" fill="#222">C</text><text x="150" y="285" text-anchor="middle" font-size="15" font-weight="700" fill="#222">AB is a diameter: angle ACB = 90°</text><circle cx="450.0" cy="150.0" r="100.0" fill="none" fill-opacity="1" stroke="#222" stroke-width="2.5"/><circle cx="450.0" cy="150.0" r="4" fill="#222"/><text x="436" y="156" text-anchor="end" font-size="15" font-weight="700" fill="#222">O</text><line x1="450.0" y1="150.0" x2="500.0" y2="63.4" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round"/><line x1="404.7" y1="8.4" x2="577.9" y2="108.4" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><polyline points="493.5,74.7 504.8,81.2 511.3,69.9" fill="none" fill-opacity="1" stroke="#c0392b" stroke-width="1.8" stroke-linejoin="round"/><circle cx="500.0" cy="63.4" r="4" fill="#222"/><text x="494.0" y="51.4" text-anchor="end" font-size="16" font-weight="700" fill="#222">T</text><text x="450" y="285" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Tangent and radius meet at 90°</text>
</svg>
