<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 335" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Angles of elevation and depression</title>
<desc id="d">Left: looking up at the top of a tree, the angle of elevation is measured up from the horizontal ground. Right: looking down from the top of a lighthouse to a boat, the angle of depression is measured down from a horizontal line.</desc>
<rect x="0" width="700" height="335" fill="#ffffff"/>
