<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Tree diagram: two counters without replacement</title>
<desc id="d">A tree diagram for picking two counters, without replacement, from a bag of 3 red and 2 blue. First pick: red 3/5, blue 2/5. After red: red 2/4, blue 2/4. After blue: red 3/4, blue 1/4.</desc>
<rect x="0" width="780" height="360" fill="#ffffff"/>
<line x1="50.0" y1="190.0" x2="230.0" y2="100.0" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round"/><line x1="50.0" y1="190.0" x2="230.0" y2="280.0" stroke="#b7791f" stroke-width="2.5" stroke-linecap="round"/><text x="130" y="128" text-anchor="end" font-size="17" font-weight="700" fill="#222">3/5</text><text x="130" y="268" text-anchor="end" font-size="17" font-weight="700" fill="#222">2/5</text><text x="242" y="106" text-anchor="start" font-size="16" font-weight="700" fill="#0d9488">Red</text><text x="242" y="286" text-anchor="start" font-size="16" font-weight="700" fill="#b7791f">Blue</text><line x1="288.0" y1="100.0" x2="460.0" y2="50.0" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round"/><text x="374.0" y="65.0" text-anchor="middle" font-size="16" font-weight="700" fill="#222">2/4</text><text x="470" y="56" text-anchor="start" font-size="16" font-weight="700" fill="#0d9488">Red</text><line x1="288.0" y1="100.0" x2="460.0" y2="150.0" stroke="#b7791f" stroke-width="2.5" stroke-linecap="round"/><text x="374.0" y="147.0" text-anchor="middle" font-size="16" font-weight="700" fill="#222">2/4</text><text x="470" y="156" text-anchor="start" font-size="16" font-weight="700" fill="#b7791f">Blue</text><line x1="288.0" y1="280.0" x2="460.0" y2="230.0" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round"/><text x="374.0" y="245.0" text-anchor="middle" font-size="16" font-weight="700" fill="#222">3/4</text><text x="470" y="236" text-anchor="start" font-size="16" font-weight="700" fill="#0d9488">Red</text><line x1="288.0" y1="280.0" x2="460.0" y2="330.0" stroke="#b7791f" stroke-width="2.5" stroke-linecap="round"/><text x="374.0" y="327.0" text-anchor="middle" font-size="16" font-weight="700" fill="#222">1/4</text><text x="470" y="336" text-anchor="start" font-size="16" font-weight="700" fill="#b7791f">Blue</text><text x="560" y="56" text-anchor="start" font-size="15" font-weight="400" fill="#222">Red, Red:  3/5 × 2/4</text><text x="560" y="156" text-anchor="start" font-size="15" font-weight="400" fill="#222">Red, Blue:  3/5 × 2/4</text><text x="560" y="236" text-anchor="start" font-size="15" font-weight="400" fill="#222">Blue, Red:  2/5 × 3/4</text><text x="560" y="336" text-anchor="start" font-size="15" font-weight="400" fill="#222">Blue, Blue:  2/5 × 1/4</text><text x="130" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#222">First pick</text><text x="370" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Second pick</text>
</svg>
