<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">Venn diagram with three sets: Art, Music and Science</title>
<desc id="d">Middle (all three) 4. A and M only 6, A and S only 3, M and S only 5. A only 7, M only 7, S only 6. Outside 12. Total 50.</desc>
<rect x="0" width="600" height="480" fill="#ffffff"/>
<rect x="20" y="20" width="560" height="440" fill="none" stroke="#333" stroke-width="2"/><text x="40" y="48" text-anchor="start" font-size="18" font-weight="400" fill="#1a1a1a">ℰ = 50</text><circle cx="235" cy="190" r="120" fill="#0d9488" fill-opacity="0.10" stroke="#0d9488" stroke-width="2.5"/><circle cx="365" cy="190" r="120" fill="#b7791f" fill-opacity="0.10" stroke="#b7791f" stroke-width="2.5"/><circle cx="300" cy="300" r="120" fill="#6d28d9" fill-opacity="0.10" stroke="#6d28d9" stroke-width="2.5"/><text x="120" y="62" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Art (A)</text><text x="480" y="62" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Music (M)</text><text x="300" y="445" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Science (S)</text><text x="185" y="170" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">7</text><text x="415" y="170" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">7</text><text x="300" y="370" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">6</text><text x="300" y="160" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">6</text><text x="240" y="270" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">3</text><text x="360" y="270" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">5</text><text x="300" y="235" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">4</text><text x="530" y="420" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">12</text>
